name: Deploy static content to Pages

# 觸發條件：當推播程式碼到 main 分支，或手動觸發時執行
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 設定 GitHub Token 的權限，允許部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 確保同一時間只有一個部署在執行，避免衝突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 單一發布任務
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4
        
      - name: 設定 GitHub Pages 環境
        uses: actions/configure-pages@v4
        
      - name: 上傳靜態檔案 (Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # 上傳根目錄下的所有檔案 (包含 index.html 與 js)
          
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
