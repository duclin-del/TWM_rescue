<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>災防通報系統 - 手機端</title>
    <style>
        body { background-color: #0a0a0a; color: #00f3ff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; transition: background-color 0.5s ease; }
        .container { background: rgba(0, 20, 30, 0.8); border: 2px solid #00f3ff; border-radius: 10px; box-shadow: 0 0 15px #00f3ff; padding: 30px; width: 90%; max-width: 400px; text-align: center; }
        .data-panel { background: #000; border: 1px solid #047a80; padding: 15px; margin: 20px 0; border-radius: 5px; font-family: monospace; text-align: left; font-size: 0.9em; }
        button { background: transparent; color: #00f3ff; border: 1px solid #00f3ff; padding: 10px 20px; margin: 5px; cursor: pointer; border-radius: 5px; text-transform: uppercase; }
        button:hover { background: #00f3ff; color: #000; }
        .warning-btn { border-color: #ff0055; color: #ff0055; }
        .cr-btn { border-color: #ffcc00; color: #ffcc00; }
        .nav-btn { display: block; margin-top: 15px; border: 2px solid #00ffaa; color: #00ffaa; text-decoration: none; padding: 12px; border-radius: 5px; font-weight: bold; background: rgba(0, 255, 170, 0.1); }
    </style>
</head>
<body>
<div class="container">
    <h2>通報元件 (Call)</h2>
    <div style="margin-bottom: 10px;">ID: <input type="text" id="userId" value="User_Alpha" style="background:#000; color:#00f3ff; border:1px solid #00f3ff; padding:5px; width:60%;"></div>
    <div class="data-panel" id="statusPanel">狀態：待命<br>緯度：--<br>經度：--<br>電量：--</div>
    <button id="startBtn">啟動追蹤</button>
    <button id="stopBtn" style="display:none;">停止追蹤</button><br>
    <button id="warnBtn" class="warning-btn">🚨 緊急警報</button>
    <button id="crBtn" class="cr-btn">🔊 支援 CR</button>
    <a id="navBtn" class="nav-btn" href="#" target="_blank" style="display:none;">🗺️ 開啟指定路徑導航</a>
    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { firebaseConfig } from './firebase-config.js'; 

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const userIdInput = document.getElementById('userId');
    const statusPanel = document.getElementById('statusPanel');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const navBtn = document.getElementById('navBtn');
    const alertSound = document.getElementById('alertSound');

    let watchId = null;
    let lastHistoryTime = 0;
    let batteryInfo = { level: '--', charging: false };

    if ('getBattery' in navigator) {
        navigator.getBattery().then(battery => {
            const upBat = () => { batteryInfo.level = Math.round(battery.level * 100); batteryInfo.charging = battery.charging; };
            upBat();
            battery.addEventListener('levelchange', upBat);
            battery.addEventListener('chargingchange', upBat);
        });
    }

    startBtn.addEventListener('click', () => {
        const uid = userIdInput.value.trim();
        if (!uid) return alert('請輸入 ID');
        alertSound.volume = 0.01; alertSound.play().then(() => { alertSound.pause(); alertSound.volume = 1; });
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));

        startBtn.style.display = 'none'; stopBtn.style.display = 'inline-block';
        watchId = navigator.geolocation.watchPosition((pos) => {
            const { latitude, longitude } = pos.coords;
            const now = Date.now();
            statusPanel.innerHTML = `狀態：傳輸中<br>緯度：${latitude.toFixed(6)}<br>經度：${longitude.toFixed(6)}<br>電量：${batteryInfo.level}% ${batteryInfo.charging ? '⚡' : ''}`;
            
            set(ref(db, `tracking/users/${uid}`), { lat: latitude, lng: longitude, timestamp: new Date().toISOString(), status: "active", battery: batteryInfo.level, charging: batteryInfo.charging });
            if (now - lastHistoryTime > 30000) {
                lastHistoryTime = now;
                set(ref(db, `tracking/history/${uid}/${now}`), { lat: latitude, lng: longitude });
            }
        }, (err) => { statusPanel.innerHTML = `錯誤：${err.message}`; }, { enableHighAccuracy: true });
        listenCmd(uid);
    });

    stopBtn.addEventListener('click', () => {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        startBtn.style.display = 'inline-block'; stopBtn.style.display = 'none'; navBtn.style.display = 'none';
        update(ref(db, `tracking/users/${userIdInput.value.trim()}`), { status: "offline" });
    });

    document.getElementById('warnBtn').onclick = () => set(ref(db, 'tracking/alerts/global'), { triggerBy: userIdInput.value.trim(), timestamp: Date.now() });
    document.getElementById('crBtn').onclick = () => set(ref(db, 'tracking/alerts/fun_cr'), { triggerBy: userIdInput.value.trim(), timestamp: Date.now() });

    function listenCmd(uid) {
        onValue(ref(db, `tracking/users/${uid}`), (snap) => { if (!snap.exists() && watchId) location.reload(); });
        onValue(ref(db, `tracking/commands/${uid}/force_offline`), (snap) => { if (snap.exists() && snap.val().timestamp > Date.now() - 5000) stopBtn.click(); });
        onValue(ref(db, `tracking/alerts/targeted_cr/${uid}`), (snap) => {
            if (snap.exists() && snap.val().timestamp > Date.now() - 5000) {
                const utter = new SpeechSynthesisUtterance('指揮中心呼叫，請支援 CR');
                utter.lang = 'zh-TW'; window.speechSynthesis.speak(utter);
            }
        });
        onValue(ref(db, `tracking/commands/${uid}/path_mission`), (snap) => {
            const data = snap.val();
            if (data && data.timestamp > Date.now() - 5000) {
                const pts = data.points;
                const dest = pts[pts.length - 1];
                const waypoints = pts.slice(0, -1).map(p => p.join(',')).join('|');
                navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${dest[0]},${dest[1]}&waypoints=${waypoints}`;
                navBtn.style.display = 'block';
                const utter = new SpeechSynthesisUtterance('收到指定路徑任務，請開啟導航');
                utter.lang = 'zh-TW'; window.speechSynthesis.speak(utter);
            }
        });
    }
</script>
</body>
</html>
