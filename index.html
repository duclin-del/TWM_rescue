<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>災防通報系統 - 手機端</title>
    <style>
        body { background-color: #0a0a0a; color: #00f3ff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; transition: background-color 0.5s ease; }
        .container { background: rgba(0, 20, 30, 0.85); backdrop-filter: blur(10px); border: 1px solid #047a80; border-radius: 12px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.15); padding: 20px; width: 92%; max-width: 400px; text-align: center; max-height: 95vh; overflow-y: auto; }
        .modern-input { width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.6); color: #00ffaa; border: 1px solid #047a80; padding: 14px; border-radius: 8px; font-size: 1.1em; text-align: center; margin-bottom: 15px; outline: none; transition: border-color 0.3s; }
        .modern-input:focus { border-color: #00ffaa; box-shadow: 0 0 10px rgba(0,255,170,0.3); }
        .primary-btn { width: 100%; padding: 15px; font-size: 1.1em; background: rgba(0, 243, 255, 0.1); border-radius: 8px; border: 1px solid #00f3ff; color: #00f3ff; font-weight: bold; cursor: pointer; }
        
        .task-header { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 0.9em; border-left: 3px solid #00ffaa; text-align: left; display: flex; align-items: center; justify-content: space-between;}
        .pulse-dot { display: inline-block; width: 8px; height: 8px; background: #00ffaa; border-radius: 50%; box-shadow: 0 0 8px #00ffaa; animation: pulse 1.5s infinite; margin-right: 8px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .data-panel { background: rgba(0,0,0,0.4); border: 1px solid #333; padding: 10px 15px; margin-bottom: 15px; border-radius: 6px; font-family: monospace; font-size: 0.85em; text-align: left; display: flex; justify-content: space-between; color: #aaa; }
        .data-val { color: #fff; font-weight: bold; }
        
        .action-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .action-row button { margin: 0; padding: 12px 5px; border-radius: 6px; flex: 1; border: 1px solid; background: transparent; font-weight: bold; cursor: pointer; }
        .stop-btn { flex: 0.7 !important; border-color: #666 !important; color: #888 !important; font-size: 0.85em !important; }
        .warning-btn { border-color: #ff0055 !important; color: #ff0055 !important; }
        .warning-btn:active { background: #ff0055; color: #fff; }
        .cr-btn { border-color: #ffcc00 !important; color: #ffcc00 !important; }
        .cr-btn:active { background: #ffcc00; color: #000; }

        .env-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 5px; }
        .env-btn { border: 1px solid #444; color: #aaa; padding: 10px 2px; font-size: 0.85em; background: transparent; border-radius: 6px; cursor: pointer; }
        .env-btn.active[data-status="安全"] { background: #00ffaa; color: #000; border-color: #00ffaa; }
        .env-btn.active[data-status="警戒"] { background: #ffcc00; color: #000; border-color: #ffcc00; }
        .env-btn.active[data-status="有傷患"] { background: #ff0055; color: #fff; border-color: #ff0055; }

        .remark-input { flex: 1; background: #000; color: #ffaa00; border: 1px solid #444; padding: 10px; border-radius: 6px; outline: none; }
        .ai-status { font-size: 0.75em; color: #00ffaa; text-align: right; margin-top: 4px; display: none; }
        .preview-img { height: 60px; border-radius: 5px; border: 1px solid #00ffaa; object-fit: cover; }
        
        .nav-btn { display: block; margin-top: 10px; border: 2px solid #00ffaa; color: #00ffaa; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; background: rgba(0, 255, 170, 0.1); }
    </style>
</head>
<body>
<div class="container">
    <div id="loginSection">
        <h2 style="margin-top:0; color:#00f3ff; margin-bottom: 20px;">災防通報終端</h2>
        <input type="text" id="userId" value="User_Alpha" placeholder="輸入 ID" class="modern-input">
        <button id="startBtn" class="primary-btn">🚀 啟動任務與追蹤</button>
    </div>
    
    <div id="trackingSection" style="display:none;">
        <div class="task-header">
            <div><span class="pulse-dot"></span><span style="color:#aaa">節點: </span><strong id="displayId" style="color:#00ffaa;"></strong></div>
        </div>
        
        <div class="data-panel">
            <div>座標: <span id="coordsDisplay" class="data-val">定位中...</span></div>
            <div>電量: <span id="batteryDisplay" class="data-val">--</span></div>
        </div>
        
        <div class="action-row">
            <button id="stopBtn" class="stop-btn">🛑 停止</button>
            <button id="warnBtn" class="warning-btn">🚨 警報</button>
            <button id="crBtn" class="cr-btn">🔊 CR</button>
        </div>
        
        <div style="border-top: 1px dashed #333; padding-top: 12px;">
            <div class="env-grid">
                <button class="env-btn" data-status="安全">安全</button>
                <button class="env-btn" data-status="警戒">警戒</button>
                <button class="env-btn" data-status="車輛不通">車不通</button>
                <button class="env-btn" data-status="有傷患">有傷患</button>
                <button class="env-btn" data-status="前往集合">去集合</button>
                <button class="env-btn" data-status="路坍">路坍</button>
            </div>
            
            <div style="margin-top:8px;">
                <div style="display:flex; gap:5px;">
                    <input type="text" id="remarkInput" class="remark-input" placeholder="現場備註 (AI 解析)">
                    <button id="remarkBtn" style="color:#ffaa00; border: 1px solid #ffaa00; background:transparent; padding:0 10px; border-radius:6px;">送出</button>
                </div>
                <div id="aiStatus" class="ai-status">🤖 AI 解析中...</div>
            </div>
        </div>

        <div style="border-top: 1px dashed #333; padding-top: 12px; margin-top: 12px;">
            <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">
            <button id="photoBtn" style="border: 1px solid #00ffaa; color:#00ffaa; background:transparent; width:100%; padding:12px; border-radius:6px; cursor:pointer;">📸 拍攝照片 (FIFO 5張)</button>
            <div id="photoPreview" style="display:flex; gap:5px; margin-top:10px; overflow-x:auto;"></div>
        </div>

        <a id="navBtn" class="nav-btn" href="#" target="_blank" style="display:none;">🗺️ 開啟 Google Maps 導航</a>
    </div>

    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <audio id="silentAudio" loop src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { firebaseConfig } from './firebase-config.js'; 

    const OPENROUTER_API_KEY = "REPLACE_WITH_OPENROUTER_KEY";
    const OPENROUTER_MODEL = "nvidia/nemotron-3-super-120b-a12b";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const ui = {
        loginSec: document.getElementById('loginSection'), trackingSec: document.getElementById('trackingSection'),
        userId: document.getElementById('userId'), displayId: document.getElementById('displayId'),
        coordsDisp: document.getElementById('coordsDisplay'), batteryDisp: document.getElementById('batteryDisplay'),
        start: document.getElementById('startBtn'), stop: document.getElementById('stopBtn'),
        nav: document.getElementById('navBtn'), snd: document.getElementById('alertSound'), silent: document.getElementById('silentAudio'),
        remarkInput: document.getElementById('remarkInput'), remarkBtn: document.getElementById('remarkBtn'), aiStatus: document.getElementById('aiStatus'),
        photoInput: document.getElementById('photoInput'), photoBtn: document.getElementById('photoBtn'), photoPreview: document.getElementById('photoPreview')
    };

    let watchId = null, lastHistoryTime = 0, batteryInfo = null;
    let currentEnvStatus = new Set();
    let currentPhotos = [];

    if ('getBattery' in navigator) {
        navigator.getBattery().then(bat => {
            batteryInfo = { level: Math.round(bat.level * 100), charging: bat.charging };
            const upBat = () => { batteryInfo.level = Math.round(bat.level * 100); batteryInfo.charging = bat.charging; };
            bat.addEventListener('levelchange', upBat); 
            bat.addEventListener('chargingchange', upBat);
        }).catch(() => {});
    }

    ui.photoBtn.onclick = () => ui.photoInput.click();
    ui.photoInput.onchange = async (e) => {
        for (let file of e.target.files) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                currentPhotos.push({ data: ev.target.result, time: Date.now() });
                if (currentPhotos.length > 5) currentPhotos.shift();
                
                ui.photoPreview.innerHTML = '';
                currentPhotos.forEach(p => {
                    const img = document.createElement('img');
                    img.src = p.data; img.className = 'preview-img'; ui.photoPreview.appendChild(img);
                });
                ui.photoBtn.innerText = `📸 已保留 ${currentPhotos.length}/5 張`;
                
                const uid = ui.userId.value.trim();
                if (uid && watchId) update(ref(db, `tracking/users/${uid}`), { images: currentPhotos });
            };
            reader.readAsDataURL(file);
        }
    };

    document.querySelectorAll('.env-btn').forEach(btn => {
        btn.onclick = (e) => {
            const status = e.target.getAttribute('data-status');
            if (currentEnvStatus.has(status)) { currentEnvStatus.delete(status); e.target.classList.remove('active'); } 
            else { currentEnvStatus.add(status); e.target.classList.add('active'); }
            const uid = ui.userId.value.trim();
            if (uid && watchId) update(ref(db, `tracking/users/${uid}`), { envStatus: Array.from(currentEnvStatus).join(',') });
        };
    });

    ui.remarkBtn.onclick = async () => {
        const uid = ui.userId.value.trim();
        let text = ui.remarkInput.value.trim();
        if (!uid || !text) return;
        ui.remarkBtn.disabled = true; ui.aiStatus.style.display = 'block';
        
        let aiAnalysis = null;
        try {
            const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${OPENROUTER_API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: OPENROUTER_MODEL,
                    messages: [{ role: "user", content: `將通報內容轉為JSON (不可包含Markdown)：{"event":"","casualties":"","needs":[],"urgency":"高/中/低"} 內容：${text}` }]
                })
            });
            const data = await res.json();
            if (res.ok) {
                let cleanJson = data.choices[0].message.content.replace(/```json/g, '').replace(/```/g, '').trim();
                aiAnalysis = JSON.parse(cleanJson);
                ui.aiStatus.innerText = "🤖 解析完成";
            } else { throw new Error(); }
        } catch (e) {
            text += " (API失效)"; ui.aiStatus.innerText = "⚠️ API失效";
        }
        update(ref(db, `tracking/users/${uid}`), { envRemark: text, ai_analysis: aiAnalysis });
        ui.remarkBtn.disabled = false;
        setTimeout(() => ui.aiStatus.style.display = 'none', 3000);
    };

    document.getElementById('warnBtn').onclick = () => {
        const uid = ui.userId.value.trim();
        if (!uid || !watchId) return;
        update(ref(db, `tracking/users/${uid}`), { isAlarm: true });
        set(ref(db, `tracking/alerts/global`), { triggerBy: uid, type: 'alarm', timestamp: Date.now() });
        setTimeout(() => update(ref(db, `tracking/users/${uid}`), { isAlarm: false }), 10000);
        playAlert('指揮中心發出緊急警報！', '#ff0055'); 
    };

    document.getElementById('crBtn').onclick = () => {
        const uid = ui.userId.value.trim();
        if (!uid || !watchId) return;
        update(ref(db, `tracking/users/${uid}`), { needCR: true });
        set(ref(db, `tracking/alerts/fun_cr`), { triggerBy: uid, timestamp: Date.now() });
        setTimeout(() => update(ref(db, `tracking/users/${uid}`), { needCR: false }), 15000); 
        playAlert('請支援CR', '#ffcc00'); 
    };

    ui.start.onclick = () => {
        const uid = ui.userId.value.trim();
        if (!uid) return alert('請輸入 ID');
        
        // 喚醒音效與語音引擎權限
        ui.snd.volume = 0.01; ui.snd.play().then(() => { ui.snd.pause(); ui.snd.volume = 1; });
        ui.silent.play().catch(e=>{});
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
        }

        ui.loginSec.style.display = 'none'; ui.trackingSec.style.display = 'block'; ui.displayId.innerText = uid;
        
        watchId = navigator.geolocation.watchPosition((pos) => {
            const { latitude, longitude } = pos.coords;
            const now = Date.now();
            ui.coordsDisp.innerText = `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
            if (batteryInfo) ui.batteryDisp.innerText = `${batteryInfo.level}% ${batteryInfo.charging ? '⚡' : ''}`;
            
            let payload = { lat: latitude, lng: longitude, timestamp: new Date().toISOString(), status: "active" };
            if (batteryInfo) { payload.battery = batteryInfo.level; payload.charging = batteryInfo.charging; }
            if (currentPhotos.length > 0) { payload.images = currentPhotos; } 
            
            update(ref(db, `tracking/users/${uid}`), payload);
            if (now - lastHistoryTime > 60000) {
                lastHistoryTime = now;
                set(ref(db, `tracking/history/${uid}/${now}`), { lat: latitude, lng: longitude });
            }
        }, (err) => { ui.coordsDisp.innerText = `定位錯誤`; }, { enableHighAccuracy: true });
        
        listenCmd(uid);
    };

    ui.stop.onclick = () => {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        ui.silent.pause();
        location.reload();
    };
    
    // 💡 核心修復：使用數值比較判斷新舊指令，徹底無視時間差
    function listenCmd(uid) {
        onValue(ref(db, `tracking/users/${uid}`), (snap) => { if (!snap.exists() && watchId) location.reload(); });
        
        let lastRetreatId = null;
        onValue(ref(db, `tracking/commands/global/retreat`), (snap) => { 
            const data = snap.val();
            if (data && data.timestamp !== lastRetreatId) {
                if (lastRetreatId !== null || data.timestamp > Date.now() - 5000) {
                    playAlert('全體人員立即撤退，重複，全體人員立即撤退，全體人員立即撤退', '#ff0000'); 
                }
                lastRetreatId = data.timestamp;
            }
        });
        
        let lastTargetAlertId = null;
        onValue(ref(db, `tracking/alerts/targeted_alert/${uid}`), (snap) => {
            const data = snap.val();
            if (data && data.timestamp !== lastTargetAlertId) {
                if (lastTargetAlertId !== null || data.timestamp > Date.now() - 5000) {
                    playAlert('指揮中心發出緊急警報！', '#ff0055');
                }
                lastTargetAlertId = data.timestamp;
            }
        });
        
        let lastCRId = null;
        onValue(ref(db, `tracking/alerts/targeted_cr/${uid}`), (snap) => {
            const data = snap.val();
            if (data && data.timestamp !== lastCRId) {
                if (lastCRId !== null || data.timestamp > Date.now() - 5000) {
                    playAlert('請支援CR', '#ffcc00');
                }
                lastCRId = data.timestamp;
            }
        });

        let lastPathId = null;
        onValue(ref(db, `tracking/commands/${uid}/path_mission`), (snap) => {
            const data = snap.val();
            if (data && data.timestamp !== lastPathId) {
                if (lastPathId !== null || data.timestamp > Date.now() - 5000) {
                    const pts = data.points, dest = pts[pts.length - 1], wps = pts.slice(0, -1).map(p => p.join(',')).join('|');
                    ui.nav.href = `https://www.google.com/maps/dir/?api=1&destination=${dest[0]},${dest[1]}&waypoints=${wps}`;
                    ui.nav.style.display = 'block';
                    playAlert('收到指定路徑任務', '#00ffaa');
                }
                lastPathId = data.timestamp;
            }
        });
    }

    // 💡 核心修復：強制清除語音佇列，保證一定會發聲
    function playAlert(msg, color) {
        ui.snd.currentTime = 0;
        ui.snd.play().catch(e=>{});
        
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // 清除卡住的語音
            const utter = new SpeechSynthesisUtterance(msg); 
            utter.lang = 'zh-TW'; 
            window.speechSynthesis.speak(utter);
        }

        document.body.style.backgroundColor = color; 
        setTimeout(() => document.body.style.backgroundColor = '#0a0a0a', 800);
    }
</script>
</body>
</html>
