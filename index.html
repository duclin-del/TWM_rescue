<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>災防通報系統 - 手機端</title>
    <style>
        body { background-color: #0a0a0a; color: #00f3ff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; transition: background-color 0.5s ease; }
        .container { background: rgba(0, 20, 30, 0.8); border: 2px solid #00f3ff; border-radius: 10px; box-shadow: 0 0 15px #00f3ff; padding: 20px; width: 90%; max-width: 400px; text-align: center; max-height: 95vh; overflow-y: auto; }
        
        .data-panel { background: #000; border: 1px solid #047a80; padding: 10px; margin: 10px 0; border-radius: 5px; font-family: monospace; font-size: 0.85em; }
        
        button { background: transparent; color: #00f3ff; border: 1px solid #00f3ff; padding: 10px 15px; margin: 5px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        button:hover { background: #00f3ff; color: #000; }
        .warning-btn { border-color: #ff0055; color: #ff0055; }
        .cr-btn { border-color: #ffcc00; color: #ffcc00; }
        .nav-btn { display: block; margin-top: 10px; border: 2px solid #00ffaa; color: #00ffaa; text-decoration: none; padding: 12px; border-radius: 5px; font-weight: bold; background: rgba(0, 255, 170, 0.1); }
        
        .env-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 5px; }
        .env-btn { border-color: #555; color: #888; padding: 8px 2px; font-size: 0.8em; margin: 0; transition: all 0.2s; }
        .env-btn.active[data-status="安全"] { background: #00ffaa; border-color: #00ffaa; color: #000; box-shadow: 0 0 8px #00ffaa;}
        .env-btn.active[data-status="警戒"] { background: #ffcc00; border-color: #ffcc00; color: #000; box-shadow: 0 0 8px #ffcc00;}
        .env-btn.active[data-status="車輛不通"] { background: #ff5500; border-color: #ff5500; color: #fff; box-shadow: 0 0 8px #ff5500;}
        .env-btn.active[data-status="有傷患"] { background: #ff0055; border-color: #ff0055; color: #fff; box-shadow: 0 0 8px #ff0055;}
        .env-btn.active[data-status="前往集合"] { background: #0088ff; border-color: #0088ff; color: #fff; box-shadow: 0 0 8px #0088ff;}
        .env-btn.active[data-status="路坍"] { background: #995522; border-color: #995522; color: #fff; box-shadow: 0 0 8px #995522;}

        .remark-input { flex: 1; background: #000; color: #ffaa00; border: 1px solid #047a80; padding: 8px; border-radius: 3px; outline: none; }
        .remark-input::placeholder { color: #555; }

        /* 🔮 新增：照片預覽區塊樣式 */
        .photo-preview-container { display: flex; gap: 5px; margin-top: 10px; overflow-x: auto; padding-bottom: 5px;}
        .preview-img { height: 60px; border-radius: 5px; border: 1px solid #00ffaa; object-fit: cover; }
    </style>
</head>
<body>
<div class="container">
    <h2 style="margin-top:0;">通報終端</h2>
    <div>ID: <input type="text" id="userId" value="User_Alpha" style="background:#000; color:#00f3ff; border:1px solid #00f3ff; padding:5px; width:60%;"></div>
    
    <div class="data-panel" id="statusPanel">狀態：待命 | 座標：-- | 電量：--</div>
    
    <button id="startBtn">啟動追蹤</button>
    <button id="stopBtn" style="display:none;">停止追蹤</button><br>
    
    <div id="controlPanel" style="display:none; margin-top:10px;">
        <div style="margin-bottom: 10px;">
            <button id="warnBtn" class="warning-btn">🚨 發送警報</button>
            <button id="crBtn" class="cr-btn">🔊 支援 CR</button>
        </div>
        
        <div style="border-top: 1px dashed #047a80; padding-top: 10px;">
            <div style="font-size:0.85em; color:#00f3ff; margin-bottom:5px;">現場環境回報 (可多選)</div>
            <div class="env-grid">
                <button class="env-btn" data-status="安全">安全</button>
                <button class="env-btn" data-status="警戒">警戒</button>
                <button class="env-btn" data-status="車輛不通">車不通</button>
                <button class="env-btn" data-status="有傷患">有傷患</button>
                <button class="env-btn" data-status="前往集合">去集合</button>
                <button class="env-btn" data-status="路坍">路坍</button>
            </div>
            
            <div style="display:flex; margin-top:8px; gap:5px;">
                <input type="text" id="remarkInput" class="remark-input" placeholder="輸入現場備註情況...">
                <button id="remarkBtn" style="margin:0; padding:5px 15px; font-size:0.85em; color:#ffaa00; border-color:#ffaa00;">送出</button>
            </div>
        </div>

        <!-- 🔮 新增：現場照片拍攝區塊 -->
        <div style="border-top: 1px dashed #047a80; padding-top: 10px; margin-top: 10px;">
            <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">
            <button id="photoBtn" style="border-color:#00ffaa; color:#00ffaa; width:100%; margin:0;">📸 拍攝或選擇照片 (最多3張)</button>
            <div id="photoPreview" class="photo-preview-container"></div>
        </div>
    </div>
    
    <a id="navBtn" class="nav-btn" href="#" target="_blank" style="display:none;">🗺️ 開啟 Google Maps 導航</a>
    
    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <audio id="silentAudio" loop src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { firebaseConfig } from './firebase-config.js'; 

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const ui = {
        userId: document.getElementById('userId'), status: document.getElementById('statusPanel'),
        start: document.getElementById('startBtn'), stop: document.getElementById('stopBtn'),
        ctrl: document.getElementById('controlPanel'), nav: document.getElementById('navBtn'),
        snd: document.getElementById('alertSound'), silent: document.getElementById('silentAudio'),
        remarkInput: document.getElementById('remarkInput'), remarkBtn: document.getElementById('remarkBtn'),
        photoInput: document.getElementById('photoInput'), photoBtn: document.getElementById('photoBtn'),
        photoPreview: document.getElementById('photoPreview')
    };

    let watchId = null, lastHistoryTime = 0, wakeLock = null;
    let batteryInfo = null; 
    let currentEnvStatus = new Set(); 
    let currentPhotos = []; // 🔮 新增：儲存壓縮後的照片 Base64 字串

    if ('getBattery' in navigator) {
        navigator.getBattery().then(bat => {
            batteryInfo = { level: Math.round(bat.level * 100), charging: bat.charging };
            const upBat = () => { batteryInfo.level = Math.round(bat.level * 100); batteryInfo.charging = bat.charging; };
            bat.addEventListener('levelchange', upBat); 
            bat.addEventListener('chargingchange', upBat);
        }).catch(() => {});
    }

    async function requestWakeLock() {
        if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
    }

    // 🔮 新增：照片選擇與壓縮處理邏輯
    ui.photoBtn.addEventListener('click', () => ui.photoInput.click());

    ui.photoInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files).slice(0, 3); // 限制最多處理 3 張
        if (files.length === 0) return;
        
        ui.photoBtn.innerText = "⏳ 處理中...";
        currentPhotos = [];
        ui.photoPreview.innerHTML = '';
        
        for (let file of files) {
            const base64 = await compressImage(file);
            currentPhotos.push(base64);
            
            const img = document.createElement('img');
            img.src = base64;
            img.className = 'preview-img';
            ui.photoPreview.appendChild(img);
        }
        ui.photoBtn.innerText = `📸 已上傳 ${currentPhotos.length} 張照片 (點擊重拍)`;

        // 立刻將照片同步到 Firebase
        const uid = ui.userId.value.trim();
        if (uid && watchId) {
            update(ref(db, `tracking/users/${uid}`), { images: currentPhotos });
        }
    });

    // 🔮 新增：畫布壓縮圖片函數 (將照片縮小至最大 800px，品質 60%，避免塞爆資料庫)
    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > MAX_SIZE) {
                        height *= MAX_SIZE / width;
                        width = MAX_SIZE;
                    } else if (height > MAX_SIZE) {
                        width *= MAX_SIZE / height;
                        height = MAX_SIZE;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    // 環境狀態切換
    document.querySelectorAll('.env-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const status = e.target.getAttribute('data-status');
            if (currentEnvStatus.has(status)) { currentEnvStatus.delete(status); e.target.classList.remove('active'); } 
            else { currentEnvStatus.add(status); e.target.classList.add('active'); }

            const uid = ui.userId.value.trim();
            if (uid) update(ref(db, `tracking/users/${uid}`), { envStatus: Array.from(currentEnvStatus).join(',') });
        });
    });

    // 備註送出
    ui.remarkBtn.addEventListener('click', () => {
        const uid = ui.userId.value.trim();
        const text = ui.remarkInput.value.trim();
        if (uid) {
            update(ref(db, `tracking/users/${uid}`), { envRemark: text });
            const origText = ui.remarkBtn.innerText;
            ui.remarkBtn.innerText = "✅"; setTimeout(() => ui.remarkBtn.innerText = origText, 1500);
        }
    });

    ui.start.addEventListener('click', async () => {
        const uid = ui.userId.value.trim();
        if (!uid) return alert('請輸入 ID');
        
        ui.snd.volume = 0.01; ui.snd.play().then(() => { ui.snd.pause(); ui.snd.volume = 1; });
        ui.silent.play().catch(e=>{});
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
        requestWakeLock();

        ui.start.style.display = 'none'; ui.stop.style.display = 'inline-block'; ui.ctrl.style.display = 'block';
        
        watchId = navigator.geolocation.watchPosition((pos) => {
            const { latitude, longitude } = pos.coords;
            const now = Date.now();
            
            let statusHtml = `傳輸中 | 座標: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
            if (batteryInfo) statusHtml += ` | 🔋${batteryInfo.level}%${batteryInfo.charging ? '⚡' : ''}`;
            ui.status.innerHTML = statusHtml;
            
            let payload = { lat: latitude, lng: longitude, timestamp: new Date().toISOString(), status: "active" };
            if (batteryInfo) { payload.battery = batteryInfo.level; payload.charging = batteryInfo.charging; }
            if (currentPhotos.length > 0) { payload.images = currentPhotos; } // 送出位置時一併夾帶照片
            
            update(ref(db, `tracking/users/${uid}`), payload);
            
            if (now - lastHistoryTime > 60000) {
                lastHistoryTime = now;
                set(ref(db, `tracking/history/${uid}/${now}`), { lat: latitude, lng: longitude });
            }
        }, (err) => { ui.status.innerHTML = `錯誤：${err.message}`; }, { enableHighAccuracy: true });
        
        listenCmd(uid);
    });

    ui.stop.addEventListener('click', () => {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        if (wakeLock) wakeLock.release().then(() => wakeLock = null);
        ui.silent.pause();
        ui.start.style.display = 'inline-block'; ui.stop.style.display = 'none'; ui.ctrl.style.display = 'none'; ui.nav.style.display = 'none';
        
        currentEnvStatus.clear();
        currentPhotos = []; // 清空照片陣列
        ui.photoPreview.innerHTML = ''; // 清空照片縮圖
        ui.photoBtn.innerText = "📸 拍攝或選擇照片 (最多3張)";
        document.querySelectorAll('.env-btn').forEach(b => b.classList.remove('active'));
        ui.remarkInput.value = '';
        
        // 離線時也把雲端的照片欄位清空
        update(ref(db, `tracking/users/${ui.userId.value.trim()}`), { status: "offline", isAlarm: false, needCR: false, envStatus: "", envRemark: "", images: null });
    });

    document.getElementById('warnBtn').onclick = () => {
        const uid = ui.userId.value.trim();
        update(ref(db, `tracking/users/${uid}`), { isAlarm: true });
        set(ref(db, `tracking/alerts/global`), { triggerBy: uid, type: 'alarm', timestamp: Date.now() });
        setTimeout(() => update(ref(db, `tracking/users/${uid}`), { isAlarm: false }), 10000);
    };

    document.getElementById('crBtn').onclick = () => {
        const uid = ui.userId.value.trim();
        update(ref(db, `tracking/users/${uid}`), { needCR: true });
        set(ref(db, `tracking/alerts/fun_cr`), { triggerBy: uid, timestamp: Date.now() });
        setTimeout(() => update(ref(db, `tracking/users/${uid}`), { needCR: false }), 15000); 
    };

    function playAlert(msg, color) {
        ui.snd.play().catch(e=>{});
        const utter = new SpeechSynthesisUtterance(msg); utter.lang = 'zh-TW'; window.speechSynthesis.speak(utter);
        document.body.style.backgroundColor = color; setTimeout(() => document.body.style.backgroundColor = '#0a0a0a', 800);
    }

    function listenCmd(uid) {
        onValue(ref(db, `tracking/users/${uid}`), (snap) => { if (!snap.exists() && watchId) location.reload(); });
        onValue(ref(db, `tracking/commands/${uid}/force_offline`), (snap) => { if (snap.exists() && snap.val().timestamp > Date.now() - 5000) ui.stop.click(); });
        onValue(ref(db, `tracking/commands/global/retreat`), (snap) => {
            if (snap.exists() && snap.val().timestamp > Date.now() - 5000) playAlert('全體人員注意，立即撤退！', '#ff0000');
        });
        onValue(ref(db, `tracking/alerts/targeted_alert/${uid}`), (snap) => {
            if (snap.exists() && snap.val().timestamp > Date.now() - 5000) playAlert('指揮中心發出緊急警報！', '#ff0055');
        });
        onValue(ref(db, `tracking/alerts/targeted_cr/${uid}`), (snap) => {
            if (snap.exists() && snap.val().timestamp > Date.now() - 5000) playAlert('指揮中心呼叫，請支援 CR！', '#665000');
        });
        onValue(ref(db, `tracking/commands/${uid}/path_mission`), (snap) => {
            const data = snap.val();
            if (data && data.timestamp > Date.now() - 5000) {
                const pts = data.points, dest = pts[pts.length - 1], wps = pts.slice(0, -1).map(p => p.join(',')).join('|');
                ui.nav.href = `https://www.google.com/maps/dir/?api=1&destination=${dest[0]},${dest[1]}&waypoints=${wps}`;
                ui.nav.style.display = 'block';
                playAlert('收到指定路徑任務，請開啟導航', '#003322');
            }
        });
    }
</script>
</body>
</html>
