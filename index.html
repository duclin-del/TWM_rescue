<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>災防通報系統 - 手機端</title>
    <style>
        body { background-color: #0a0a0a; color: #00f3ff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; transition: background-color 0.5s ease; }
        .container { background: rgba(0, 20, 30, 0.85); backdrop-filter: blur(10px); border: 1px solid #047a80; border-radius: 12px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.15); padding: 20px; width: 92%; max-width: 400px; text-align: center; max-height: 95vh; overflow-y: auto; }
        .modern-input { width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.6); color: #00ffaa; border: 1px solid #047a80; padding: 14px; border-radius: 8px; font-size: 1.1em; text-align: center; margin-bottom: 15px; outline: none; transition: border-color 0.3s; }
        .modern-input:focus { border-color: #00ffaa; box-shadow: 0 0 10px rgba(0,255,170,0.3); }
        .primary-btn { width: 100%; padding: 15px; font-size: 1.1em; background: rgba(0, 243, 255, 0.1); border-radius: 8px; }
        .task-header { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 0.9em; border-left: 3px solid #00ffaa; text-align: left; display: flex; align-items: center; justify-content: space-between;}
        .pulse-dot { display: inline-block; width: 8px; height: 8px; background: #00ffaa; border-radius: 50%; box-shadow: 0 0 8px #00ffaa; animation: pulse 1.5s infinite; margin-right: 8px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .data-panel { background: rgba(0,0,0,0.4); border: 1px solid #333; padding: 10px 15px; margin-bottom: 15px; border-radius: 6px; font-family: monospace; font-size: 0.85em; text-align: left; display: flex; justify-content: space-between; color: #aaa; }
        .data-val { color: #fff; font-weight: bold; }
        button { background: transparent; color: #00f3ff; border: 1px solid #00f3ff; cursor: pointer; font-weight: bold; transition: all 0.2s; outline: none; }
        button:hover { background: #00f3ff; color: #000; }
        button:disabled { border-color: #555; color: #555; cursor: not-allowed; }
        .action-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .action-row button { margin: 0; padding: 12px 5px; border-radius: 6px; }
        .stop-btn { flex: 0.7; border-color: #666; color: #888; font-size: 0.85em; }
        .stop-btn:hover { background: #ff0055; border-color: #ff0055; color: #fff; }
        .warning-btn { flex: 1.2; border-color: #ff0055; color: #ff0055; font-size: 1em; }
        .cr-btn { flex: 1.2; border-color: #ffcc00; color: #ffcc00; font-size: 1em; }
        .nav-btn { display: block; margin-top: 10px; border: 2px solid #00ffaa; color: #00ffaa; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; background: rgba(0, 255, 170, 0.1); }
        .env-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 5px; }
        .env-btn { border-color: #444; color: #aaa; padding: 10px 2px; font-size: 0.85em; margin: 0; border-radius: 6px; }
        .env-btn.active[data-status="安全"] { background: #00ffaa; border-color: #00ffaa; color: #000; box-shadow: 0 0 8px #00ffaa;}
        .env-btn.active[data-status="警戒"] { background: #ffcc00; border-color: #ffcc00; color: #000; box-shadow: 0 0 8px #ffcc00;}
        .env-btn.active[data-status="車輛不通"] { background: #ff5500; border-color: #ff5500; color: #fff; box-shadow: 0 0 8px #ff5500;}
        .env-btn.active[data-status="有傷患"] { background: #ff0055; border-color: #ff0055; color: #fff; box-shadow: 0 0 8px #ff0055;}
        .env-btn.active[data-status="前往集合"] { background: #0088ff; border-color: #0088ff; color: #fff; box-shadow: 0 0 8px #0088ff;}
        .env-btn.active[data-status="路坍"] { background: #995522; border-color: #995522; color: #fff; box-shadow: 0 0 8px #995522;}
        .remark-input { flex: 1; background: #000; color: #ffaa00; border: 1px solid #444; padding: 10px; border-radius: 6px; outline: none; }
        .remark-input::placeholder { color: #666; }
        .ai-status { font-size: 0.75em; color: #00ffaa; text-align: right; margin-top: 4px; display: none; }
        .photo-preview-container { display: flex; gap: 5px; margin-top: 10px; overflow-x: auto; padding-bottom: 5px;}
        .preview-img { height: 60px; border-radius: 5px; border: 1px solid #00ffaa; object-fit: cover; }
    </style>
</head>
<body>
<div class="container">
    <div id="loginSection">
        <h2 style="margin-top:0; color:#00f3ff; margin-bottom: 20px;">災防通報終端</h2>
        <input type="text" id="userId" value="User_Alpha" placeholder="請輸入派遣 ID" class="modern-input">
        <button id="startBtn" class="primary-btn">🚀 啟動任務與追蹤</button>
    </div>
    <div id="trackingSection" style="display:none;">
        <div class="task-header">
            <div><span class="pulse-dot"></span><span style="color:#aaa">ID: </span><strong id="displayId" style="color:#00ffaa;"></strong></div>
        </div>
        <div class="data-panel">
            <div>座標: <span id="coordsDisplay" class="data-val">定位中...</span></div>
            <div>電量: <span id="batteryDisplay" class="data-val">--</span></div>
        </div>
        <div class="action-row">
            <button id="stopBtn" class="stop-btn">🛑 停止</button>
            <button id="warnBtn" class="warning-btn">🚨 警報</button>
            <button id="crBtn" class="cr-btn">🔊 支援CR</button>
        </div>
        <div style="border-top: 1px dashed #333; padding-top: 12px;">
            <div style="font-size:0.85em; color:#00f3ff; margin-bottom:6px; text-align:left;">現場環境回報 (可多選)</div>
            <div class="env-grid">
                <button class="env-btn" data-status="安全">安全</button>
                <button class="env-btn" data-status="警戒">警戒</button>
                <button class="env-btn" data-status="車輛不通">車不通</button>
                <button class="env-btn" data-status="有傷患">有傷患</button>
                <button class="env-btn" data-status="前往集合">去集合</button>
                <button class="env-btn" data-status="路坍">路坍</button>
            </div>
            <div style="margin-top:8px;">
                <div style="display:flex; gap:5px;">
                    <input type="text" id="remarkInput" class="remark-input" placeholder="輸入現場備註 (支援AI解析)...">
                    <button id="remarkBtn" style="margin:0; padding:5px 15px; font-size:0.9em; color:#ffaa00; border-color:#ffaa00; border-radius:6px;">送出</button>
                </div>
                <div id="aiStatus" class="ai-status">🤖 AI 處理中...</div>
            </div>
        </div>
        <div style="border-top: 1px dashed #333; padding-top: 12px; margin-top: 12px;">
            <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">
            <button id="photoBtn" style="border-color:#00ffaa; color:#00ffaa; width:100%; margin:0; padding:12px; border-radius:6px;">📸 拍攝照片 (最多保留 5 張)</button>
            <div id="photoPreview" class="photo-preview-container"></div>
        </div>
        <a id="navBtn" class="nav-btn" href="#" target="_blank" style="display:none;">🗺️ 開啟 Google Maps 導航</a>
    </div>
    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <audio id="silentAudio" loop src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { firebaseConfig } from './firebase-config.js'; 

    // 💡 已替換為安全占位符，將由 GitHub Actions 替換
    const OPENROUTER_API_KEY = "REPLACE_WITH_OPENROUTER_KEY";
    const OPENROUTER_MODEL = "nvidia/nemotron-3-super-120b-a12b";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const ui = {
        loginSec: document.getElementById('loginSection'), trackingSec: document.getElementById('trackingSection'),
        userId: document.getElementById('userId'), displayId: document.getElementById('displayId'),
        coordsDisp: document.getElementById('coordsDisplay'), batteryDisp: document.getElementById('batteryDisplay'),
        start: document.getElementById('startBtn'), stop: document.getElementById('stopBtn'),
        nav: document.getElementById('navBtn'), snd: document.getElementById('alertSound'), silent: document.getElementById('silentAudio'),
        remarkInput: document.getElementById('remarkInput'), remarkBtn: document.getElementById('remarkBtn'), aiStatus: document.getElementById('aiStatus'),
        photoInput: document.getElementById('photoInput'), photoBtn: document.getElementById('photoBtn'), photoPreview: document.getElementById('photoPreview')
    };

    let watchId = null, lastHistoryTime = 0, wakeLock = null;
    let batteryInfo = null; 
    let currentEnvStatus = new Set(); 
    let currentPhotos = []; 

    if ('getBattery' in navigator) {
        navigator.getBattery().then(bat => {
            batteryInfo = { level: Math.round(bat.level * 100), charging: bat.charging };
            const upBat = () => { batteryInfo.level = Math.round(bat.level * 100); batteryInfo.charging = bat.charging; };
            bat.addEventListener('levelchange', upBat); 
            bat.addEventListener('chargingchange', upBat);
        }).catch(() => {});
    }

    async function requestWakeLock() {
        if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
    }

    ui.photoBtn.addEventListener('click', () => ui.photoInput.click());
    ui.photoInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files); 
        if (files.length === 0) return;
        ui.photoBtn.innerText = "⏳ 處理中...";
        for (let file of files) {
            const base64 = await compressImage(file);
            currentPhotos.push({ data: base64, time: Date.now() });
        }
        if (currentPhotos.length > 5) currentPhotos = currentPhotos.slice(-5);
        ui.photoPreview.innerHTML = '';
        currentPhotos.forEach(p => {
            const img = document.createElement('img');
            img.src = p.data; img.className = 'preview-img'; ui.photoPreview.appendChild(img);
        });
        ui.photoBtn.innerText = `📸 已保留 ${currentPhotos.length}/5 張 (點擊繼續拍)`;
        const uid = ui.userId.value.trim();
        if (uid && watchId) update(ref(db, `tracking/users/${uid}`), { images: currentPhotos });
    });

    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 800;
                    let width = img.width, height = img.height;
                    if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } 
                    else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    document.querySelectorAll('.env-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const status = e.target.getAttribute('data-status');
            if (currentEnvStatus.has(status)) { currentEnvStatus.delete(status); e.target.classList.remove('active'); } 
            else { currentEnvStatus.add(status); e.target.classList.add('active'); }
            const uid = ui.userId.value.trim();
            if (uid) update(ref(db, `tracking/users/${uid}`), { envStatus: Array.from(currentEnvStatus).join(',') });
        });
    });

    ui.remarkBtn.addEventListener('click', async () => {
        const uid = ui.userId.value.trim();
        let text = ui.remarkInput.value.trim();
        if (!uid || !text) return;
        ui.remarkBtn.disabled = true;
        ui.aiStatus.style.display = 'block';
        ui.aiStatus.innerText = "🤖 AI 解析中...";
        let aiAnalysis = null;
        try {
            const prompt = `你是一個災防分析AI。請將以下的口語通報內容轉換為JSON格式，只輸出JSON字串，不要任何Markdown標記。萃取結構：{"event": "事件摘要", "casualties": "傷亡狀況", "needs": ["需求"], "urgency": "高/中/低"}。通報內容：${text}`;
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${OPENROUTER_API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: OPENROUTER_MODEL, messages: [{ role: "user", content: prompt }] })
            });
            const data = await response.json();
            if (response.ok && data.choices && data.choices.length > 0) {
                let jsonStr = data.choices[0].message.content;
                jsonStr = jsonStr.replace(/```json/g, '').replace(/```/g, '').trim(); 
                aiAnalysis = JSON.parse(jsonStr);
                ui.aiStatus.innerText = "🤖 AI 解析完成";
            } else { throw new Error(); }
        } catch (error) {
            ui.aiStatus.innerText = "⚠️ API 失效";
            text = text + "(API失效)";
            aiAnalysis = null;
        }
        update(ref(db, `tracking/users/${uid}`), { envRemark: text, ai_analysis: aiAnalysis });
        ui.remarkBtn.disabled = false;
        setTimeout(() => { ui.aiStatus.style.display = 'none'; }, 3000);
    });

    ui.start.addEventListener('click', async () => {
        const uid = ui.userId.value.trim();
        if (!uid) return alert('請輸入 ID');
        ui.snd.volume = 0.01; ui.snd.play().then(() => { ui.snd.pause(); ui.snd.volume = 1; });
        ui.silent.play().catch(e=>{});
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
        requestWakeLock();
        ui.loginSec.style.display = 'none'; ui.trackingSec.style.display = 'block'; ui.displayId.innerText = uid;
        watchId = navigator.geolocation.watchPosition((pos) => {
            const { latitude, longitude } = pos.coords;
            const now = Date.now();
            ui.coordsDisp.innerText = `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
            if (batteryInfo) ui.batteryDisp.innerText = `${batteryInfo.level}% ${batteryInfo.charging ? '⚡' : ''}`;
            let payload = { lat: latitude, lng: longitude, timestamp: new Date().toISOString(), status: "active" };
            if (batteryInfo) { payload.battery = batteryInfo.level; payload.charging = batteryInfo.charging; }
            if (currentPhotos.length > 0) { payload.images = currentPhotos; } 
            update(ref(db, `tracking/users/${uid}`), payload);
            if (now - lastHistoryTime > 60000) {
                lastHistoryTime = now;
                set(ref(db, `tracking/history/${uid}/${now}`), { lat: latitude, lng: longitude });
            }
        }, (err) => { ui.coordsDisp.innerText = `定位錯誤`; }, { enableHighAccuracy: true });
        listenCmd(uid);
    });

    ui.stop.addEventListener('click', () => {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        if (wakeLock) wakeLock.release().then(() => wakeLock = null);
        ui.silent.pause();
        ui.trackingSec.style.display = 'none'; ui.loginSec.style.display = 'block'; ui.nav.style.display = 'none';
        currentEnvStatus.clear(); currentPhotos = []; ui.photoPreview.innerHTML = ''; 
        ui.photoBtn.innerText = "📸 拍攝照片 (最多保留 5 張)";
        document.querySelectorAll('.env-btn').forEach(b => b.classList.remove('active'));
        ui.remarkInput.value = ''; ui.aiStatus.style.display = 'none'; ui.coordsDisp.innerText = '定位中...';
        update(ref(db, `tracking/users/${ui.userId.value.trim()}`), { status: "offline", isAlarm: false, needCR: false, envStatus: "", envRemark: "", ai_analysis: null, images: null });
    });

    function listenCmd(uid) {
        onValue(ref(db, `tracking/users/${uid}`), (snap) => { if (!snap.exists() && watchId) location.reload(); });
        onValue(ref(db, `tracking/commands/${uid}/force_offline`), (snap) => { if (snap.exists() && snap.val().timestamp > Date.now() - 5000) ui.stop.click(); });
        onValue(ref(db, `tracking/commands/global/retreat`), (snap) => { if (snap.exists() && snap.val().timestamp > Date.now() - 5000) playAlert('全體撤退！', '#ff0000'); });
        onValue(ref(db, `tracking/commands/${uid}/path_mission`), (snap) => {
            const data = snap.val();
            if (data && data.timestamp > Date.now() - 5000) {
                const pts = data.points, dest = pts[pts.length - 1], wps = pts.slice(0, -1).map(p => p.join(',')).join('|');
                ui.nav.href = `https://www.google.com/maps/dir/?api=1&destination=${dest[0]},${dest[1]}&waypoints=${wps}`;
                ui.nav.style.display = 'block';
                playAlert('收到指定路徑任務', '#003322');
            }
        });
    }

    function playAlert(msg, color) {
        ui.snd.play().catch(e=>{});
        const utter = new SpeechSynthesisUtterance(msg); utter.lang = 'zh-TW'; window.speechSynthesis.speak(utter);
        document.body.style.backgroundColor = color; setTimeout(() => document.body.style.backgroundColor = '#0a0a0a', 800);
    }
</script>
</body>
</html>
