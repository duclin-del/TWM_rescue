<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>災防通報：即時軌跡與音訊警報系統</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00f3ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(0, 20, 30, 0.8);
            border: 2px solid #00f3ff;
            border-radius: 10px;
            box-shadow: 0 0 15px #00f3ff, inset 0 0 10px #00f3ff;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h2 { text-transform: uppercase; letter-spacing: 2px; }
        .data-panel {
            background: #000;
            border: 1px solid #047a80;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            font-family: monospace;
            color: #fff;
            text-align: left;
            word-wrap: break-word;
        }
        button {
            background-color: transparent;
            color: #00f3ff;
            border: 1px solid #00f3ff;
            padding: 10px 20px;
            margin: 10px 5px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        button:hover { background-color: #00f3ff; color: #000; box-shadow: 0 0 10px #00f3ff; }
        .warning-btn { border-color: #ff0055; color: #ff0055; }
        .warning-btn:hover { background-color: #ff0055; color: #fff; box-shadow: 0 0 10px #ff0055; }
        .cr-btn { border-color: #ffcc00; color: #ffcc00; }
        .cr-btn:hover { background-color: #ffcc00; color: #000; box-shadow: 0 0 10px #ffcc00; }
    </style>
</head>
<body>

<div class="container">
    <h2>Tracker Component</h2>
    <div>使用者 ID: <input type="text" id="userId" value="User_Alpha" style="background:#000; color:#00f3ff; border:1px solid #00f3ff; padding:5px;"></div>
    
    <div class="data-panel" id="statusPanel">
        系統狀態：待命中...<br>
        緯度：--<br>
        經度：--
    </div>

    <button id="startBtn">啟動追蹤</button>
    <button id="stopBtn" style="display:none;">停止追蹤</button>
    <br>
    <button id="warnBtn" class="warning-btn">🚨 發送緊急警報</button>
    <button id="crBtn" class="cr-btn">🔊 請支援 CR</button>
    
    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { firebaseConfig } from './firebase-config.js'; 

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const userIdInput = document.getElementById('userId');
    const statusPanel = document.getElementById('statusPanel');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const warnBtn = document.getElementById('warnBtn');
    const crBtn = document.getElementById('crBtn');
    const alertSound = document.getElementById('alertSound');

    let watchId = null;
    let lastHistoryTime = 0; // 軌跡紀錄的時間點控制

    // 啟動追蹤
    startBtn.addEventListener('click', () => {
        const uid = userIdInput.value.trim();
        if (!uid) return alert('請輸入使用者 ID');
        if (!navigator.geolocation) return alert('您的設備不支援地理定位');

        // 解鎖瀏覽器音效限制
        alertSound.volume = 0.01;
        alertSound.play().then(() => {
            alertSound.pause();
            alertSound.currentTime = 0;
            alertSound.volume = 1; 
        }).catch(e => console.log("音效解鎖失敗", e));

        const unlockUtterance = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(unlockUtterance);

        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
        lastHistoryTime = 0; // 重置軌跡計時
        
        watchId = navigator.geolocation.watchPosition(
            (position) => {
                const { latitude, longitude, accuracy } = position.coords;
                const currentTime = Date.now();
                const timestamp = new Date().toISOString();
                
                statusPanel.innerHTML = `系統狀態：傳輸中...<br>緯度：${latitude.toFixed(6)}<br>經度：${longitude.toFixed(6)}<br>精度：${accuracy.toFixed(1)}m`;

                // 1. 更新即時單點狀態
                set(ref(db, `tracking/users/${uid}`), {
                    lat: latitude, lng: longitude, timestamp: timestamp, status: "active"
                });

                // 2. 歷史軌跡節流 (每 30 秒才記錄一個點，避免過度密集)
                if (currentTime - lastHistoryTime > 30000) {
                    lastHistoryTime = currentTime;
                    set(ref(db, `tracking/history/${uid}/${currentTime}`), {
                        lat: latitude, lng: longitude
                    });
                }
            },
            (error) => { statusPanel.innerHTML = `錯誤：${error.message}`; },
            { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );

        listenForWarnings(uid);
    });

    // 停止追蹤 (可由使用者手動點擊，或被指揮中心強制觸發)
    stopBtn.addEventListener('click', () => {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        startBtn.style.display = 'inline-block';
        stopBtn.style.display = 'none';
        statusPanel.innerHTML = `系統狀態：已停止<br>緯度：--<br>經度：--`;
        
        const uid = userIdInput.value.trim();
        update(ref(db, `tracking/users/${uid}`), { status: "offline" });
    });

    warnBtn.addEventListener('click', () => {
        set(ref(db, `tracking/alerts/global`), { triggerBy: userIdInput.value.trim(), timestamp: Date.now() });
        statusPanel.innerHTML += `<br><span style="color:#ff0055">已發送緊急警告訊號！</span>`;
    });

    crBtn.addEventListener('click', () => {
        set(ref(db, `tracking/alerts/fun_cr`), { triggerBy: userIdInput.value.trim(), timestamp: Date.now() });
        statusPanel.innerHTML += `<br><span style="color:#ffcc00">已發送「請支援 CR」廣播！</span>`;
    });

    function listenForWarnings(currentUid) {
        // 監聽全局緊急警告
        const alertRef = ref(db, 'tracking/alerts/global');
        let initialLoadAlert = true;
        onValue(alertRef, (snapshot) => {
            const data = snapshot.val();
            if (initialLoadAlert) { initialLoadAlert = false; return; }
            if (data && data.triggerBy !== currentUid) {
                alertSound.play();
                document.body.style.backgroundColor = '#500';
                setTimeout(() => document.body.style.backgroundColor = '#0a0a0a', 500);
                statusPanel.innerHTML += `<br><span style="color:#ff0055">收到來自 ${data.triggerBy} 的警告！</span>`;
            }
        });

        // 監聽指揮中心的「專屬 CR 呼叫」
        const myCrRef = ref(db, `tracking/alerts/targeted_cr/${currentUid}`);
        let initialLoadMyCr = true;
        onValue(myCrRef, (snapshot) => {
            const data = snapshot.val();
            if (initialLoadMyCr) { initialLoadMyCr = false; return; }
            if (data) {
                const utterance = new SpeechSynthesisUtterance('指揮中心呼叫，請支援、吸、阿');
                utterance.lang = 'zh-TW'; utterance.rate = 1.1;
                window.speechSynthesis.speak(utterance);
                
                document.body.style.backgroundColor = '#665000';
                setTimeout(() => document.body.style.backgroundColor = '#0a0a0a', 500);
                statusPanel.innerHTML += `<br><span style="color:#ffcc00; font-weight:bold;">收到指揮中心專屬指令：請支援 CR！</span>`;
            }
        });

        // 🔮 新增：監聽指揮中心的「強制離線」指令
        const offlineCmdRef = ref(db, `tracking/commands/${currentUid}/force_offline`);
        let initialLoadOffline = true;
        onValue(offlineCmdRef, (snapshot) => {
            const data = snapshot.val();
            if (initialLoadOffline) { initialLoadOffline = false; return; }
            if (data) {
                // 自動觸發停止追蹤按鈕
                stopBtn.click();
                
                const utterance = new SpeechSynthesisUtterance('指揮中心已強制關閉您的通報系統');
                utterance.lang = 'zh-TW'; 
                window.speechSynthesis.speak(utterance);
                
                document.body.style.backgroundColor = '#550000';
                setTimeout(() => document.body.style.backgroundColor = '#0a0a0a', 500);
                statusPanel.innerHTML += `<br><span style="color:#ff0055; font-weight:bold;">⚠️ 您已被指揮中心強制離線！</span>`;
            }
        });
    }
</script>
</body>
</html>
