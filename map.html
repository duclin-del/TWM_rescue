<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>災防通報：指揮中心戰情儀表板</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #00f3ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #map-container {
            flex: 3;
            position: relative;
            border-right: 2px solid #00f3ff;
            box-shadow: inset -5px 0 15px rgba(0, 243, 255, 0.2);
        }
        #map {
            width: 100%;
            height: 100%;
            background: #000;
        }
        #sidebar {
            flex: 1;
            background: rgba(0, 20, 30, 0.95);
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            min-width: 300px;
        }
        h2 {
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid #047a80;
            padding-bottom: 10px;
            margin-top: 0;
            text-align: center;
        }
        .user-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #047a80;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .user-card:hover {
            border-color: #00f3ff;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
        .user-card.offline {
            border-color: #555;
            color: #888;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #00f3ff;
            margin-right: 8px;
            box-shadow: 0 0 8px #00f3ff;
        }
        .offline .status-dot {
            background-color: #555;
            box-shadow: none;
        }
        .data-label { font-size: 0.85em; color: #047a80; }
        .data-value { font-family: monospace; font-size: 1.1em; }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
    </div>
    
    <div id="sidebar">
        <h2>即時動態監控 (Analysis)</h2>
        <div id="user-list">
            <div style="text-align:center; color:#047a80;">等待資料連線中...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { firebaseConfig } from './firebase-config.js';

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const map = L.map('map').setView([23.6978, 120.9605], 7);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        const markers = {};
        const userListDiv = document.getElementById('user-list');

        // 監聽人員座標移動
        const usersRef = ref(db, 'tracking/users');
        onValue(usersRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            let listHTML = '';
            for (const uid in data) {
                const user = data[uid];
                const lat = user.lat;
                const lng = user.lng;
                const isActive = user.status === 'active';
                const timeString = new Date(user.timestamp).toLocaleTimeString();

                listHTML += `
                    <div class="user-card ${isActive ? '' : 'offline'}">
                        <div style="font-weight:bold; font-size:1.2em; margin-bottom:5px;">
                            <span class="status-dot"></span>${uid}
                        </div>
                        <div><span class="data-label">狀態:</span> <span class="data-value">${user.status.toUpperCase()}</span></div>
                        <div><span class="data-label">座標:</span> <span class="data-value">${lat.toFixed(4)}, ${lng.toFixed(4)}</span></div>
                        <div><span class="data-label">更新:</span> <span class="data-value">${timeString}</span></div>
                    </div>
                `;

                if (isActive) {
                    if (markers[uid]) {
                        markers[uid].setLatLng([lat, lng]);
                        markers[uid].bindPopup(`<b>${uid}</b><br>更新時間: ${timeString}`);
                    } else {
                        const tronIcon = L.divIcon({
                            className: 'custom-div-icon',
                            html: `<div style="background-color:#00f3ff; width:12px; height:12px; border-radius:50%; box-shadow: 0 0 10px #00f3ff;"></div>`,
                            iconSize: [12, 12],
                            iconAnchor: [6, 6]
                        });
                        markers[uid] = L.marker([lat, lng], {icon: tronIcon}).addTo(map);
                        markers[uid].bindPopup(`<b>${uid}</b><br>更新時間: ${timeString}`);
                    }
                } else {
                    if (markers[uid]) {
                        map.removeLayer(markers[uid]);
                        delete markers[uid];
                    }
                }
            }
            userListDiv.innerHTML = listHTML;
        });

        // 監聽趣味廣播「請支援 CR」
        const crRef = ref(db, 'tracking/alerts/fun_cr');
        let initialLoadCR = true;

        onValue(crRef, (snapshot) => {
            const data = snapshot.val();
            
            if (initialLoadCR) {
                initialLoadCR = false;
                return;
            }

            if (data) {
                console.log("收到來自", data.triggerBy, "的 CR 支援請求");
                
                // 使用瀏覽器內建的語音合成 (Text-to-Speech)
                const utterance = new SpeechSynthesisUtterance('請支援、吸、阿'); 
                utterance.lang = 'zh-TW'; 
                utterance.rate = 0.9;     
                utterance.pitch = 1.2;    
                
                window.speechSynthesis.speak(utterance);
                
                // 畫面上跳出提示 (非阻塞)
                setTimeout(() => {
                    alert(`收到來自 [${data.triggerBy}] 的廣播：請支援 CR！`);
                }, 100);
            }
        });
    </script>
</body>
</html>
