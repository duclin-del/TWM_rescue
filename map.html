<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>戰情儀表板 (Analysis)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; background: #0a0a0a; color: #00f3ff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #map-container { flex: 3; position: relative; border-right: 2px solid #00f3ff; }
        #map { width: 100%; height: 100%; background: #000; }
        .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%); }
        
        #sidebar { flex: 1; background: rgba(0, 20, 30, 0.95); padding: 15px; display: flex; flex-direction: column; min-width: 380px; }
        
        .toolbar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #047a80; padding-bottom: 10px; margin-bottom: 10px; flex-wrap: wrap; gap: 5px; }
        .toolbar button { background: transparent; border: 1px solid #00f3ff; color: #00f3ff; padding: 5px 8px; cursor: pointer; border-radius: 3px; font-weight: bold; }
        .toolbar button:hover { background: #00f3ff; color: #000; }
        .btn-danger { border-color: #ff0055 !important; color: #ff0055 !important; }
        .btn-danger:hover { background: #ff0055 !important; color: #fff !important; }

        .user-card { background: rgba(0,0,0,0.6); border: 1px solid #047a80; padding: 8px 10px; margin-bottom: 8px; font-size: 0.85em; border-radius: 4px; }
        .user-card:hover { border-color: #00f3ff; }
        
        .header-row { display: flex; align-items: center; font-size: 1.1em; font-weight: bold; margin-bottom: 4px; flex-wrap: wrap; gap: 4px; }
        .info-row { color: #aaa; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9em; }
        
        .cr-tag { background: #ffcc00; color: #000; font-size: 0.7em; padding: 2px 6px; border-radius: 10px; vertical-align: middle; }
        .env-tag { font-size: 0.7em; padding: 2px 6px; border-radius: 4px; font-weight: bold; vertical-align: middle; }
        .env-safe { background: #00ffaa; color: #000; }
        .env-alert { background: #ffcc00; color: #000; }
        .env-blocked { background: #ff5500; color: #fff; }
        .env-casualty { background: #ff0055; color: #fff; }
        .env-rally { background: #0088ff; color: #fff; }
        .env-collapse { background: #995522; color: #fff; }

        .flash-name { color: #ff0055; text-shadow: 0 0 10px #ff0055; animation: blinkFast 0.5s infinite alternate; }
        @keyframes blinkFast { from { opacity: 1; } to { opacity: 0.3; } }
        
        .battery-badge { font-size: 0.8em; padding: 1px 5px; border-radius: 3px; border: 1px solid #00f3ff; margin-left: auto; }
        .battery-low { border-color: #ff0055; color: #ff0055; animation: blinkFast 1s infinite alternate; }

        /* 🔮 修改：改用 Flexbox 以靈活適應 4 顆或 5 顆按鈕 */
        .action-grid { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        .action-btn { flex: 1 1 18%; background: transparent; border: 1px solid; color: inherit; font-size: 0.8em; padding: 4px 0; cursor: pointer; border-radius: 3px; text-align: center; white-space: nowrap; }
        .btn-alert { border-color: #ff0055; color: #ff0055; }
        .btn-call { border-color: #ffcc00; color: #ffcc00; }
        .btn-path { border-color: #00ffaa; color: #00ffaa; }
        .btn-off { border-color: #888; color: #888; }
        .btn-photo { border-color: #00aaff; color: #00aaff; } /* 照片按鈕專用顏色 */
        
        .remark-box { margin-top: 5px; font-size: 0.85em; color: #ffaa00; background: rgba(255, 170, 0, 0.1); padding: 4px 8px; border-radius: 3px; border-left: 2px solid #ffaa00; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; transition: all 0.2s ease; }
        .remark-box.expanded { white-space: normal; word-break: break-all; }

        #log-panel { height: 100px; border-top: 1px dashed #047a80; font-size: 0.75em; overflow-y: auto; padding-top: 5px; margin-top: 10px; }
        input[type="checkbox"] { accent-color: #00f3ff; width: 16px; height: 16px; margin-right: 5px; cursor: pointer; }

        /* 🔮 新增：彈出式照片檢視窗 (Modal) */
        #photoModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        #photoModal .close-btn { position: absolute; top: 20px; right: 20px; background: transparent; color: #ff0055; border: 1px solid #ff0055; padding: 8px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 1.1em;}
        #photoModal .close-btn:hover { background: #ff0055; color: #fff; }
        #modalGallery { display: flex; gap: 15px; max-width: 90vw; overflow-x: auto; padding: 20px; align-items: center;}
        #modalGallery img { max-height: 80vh; max-width: 85vw; object-fit: contain; border: 2px solid #00f3ff; border-radius: 8px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.3); }
    </style>
</head>
<body>
<div id="map-container"><div id="map"></div></div>
<div id="sidebar">
    <div class="toolbar">
        <button onclick="clearPath()">清除路徑/標記</button>
        <button onclick="toggleAllTrack(true)">全選</button>
        <button onclick="toggleAllTrack(false)">取消全選</button>
        <button class="btn-danger" onclick="allRetreat()">🚨 全體撤退</button>
    </div>
    
    <div id="user-list" style="flex-grow:1; overflow-y:auto;"></div>
    <details><summary style="cursor:pointer; color:#888; padding:5px; border-top:1px solid #333; margin-top:5px;">離線紀錄</summary><div id="offline-list"></div></details>
    <div id="log-panel" id="logs"></div>
    
    <audio id="pcAlertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
</div>

<!-- 🔮 新增：彈出照片視窗 -->
<div id="photoModal">
    <button class="close-btn" onclick="closePhotoModal()">關閉 (X)</button>
    <div id="modalGallery"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { firebaseConfig } from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const map = L.map('map').setView([23.7, 121], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const pcSound = document.getElementById('pcAlertSound');

    let plannedPath = [], pathMarkers = [];
    let pathLine = L.polyline([], {color:'#00ffaa', weight:3, dashArray:'5,10'}).addTo(map);
    
    const activeTrackers = new Set(); 
    let knownUsers = new Set();       
    const markers = {}, polylines = {}, hListeners = {};
    
    // 🔮 新增：全域照片暫存庫，供 Modal 讀取
    window.globalPhotos = {}; 

    map.on('click', e => {
        plannedPath.push([e.latlng.lat, e.latlng.lng]);
        pathLine.setLatLngs(plannedPath);
        pathMarkers.push(L.circleMarker(e.latlng, {radius:4, color:'#00ffaa'}).addTo(map));
        log(`已加入路徑點`);
    });

    window.clearPath = () => { 
        plannedPath = []; pathLine.setLatLngs([]); 
        pathMarkers.forEach(m => map.removeLayer(m)); pathMarkers = []; 
        log("路徑與標記已清除"); 
    };

    window.toggleAllTrack = (check) => {
        document.querySelectorAll('.track-cb').forEach(cb => {
            if (cb.checked !== check) { cb.checked = check; cb.dispatchEvent(new Event('change')); }
        });
    };

    window.allRetreat = () => {
        if(confirm('確定要對所有人員發出「全體撤退」警報嗎？')) {
            set(ref(db, `tracking/commands/global/retreat`), { timestamp: Date.now() });
            log("🚨 已發出全體撤退指令！");
        }
    };

    function log(m) { const d = document.createElement('div'); d.innerHTML = `[${new Date().toLocaleTimeString()}] ${m}`; document.getElementById('log-panel').prepend(d); }

    onValue(ref(db, 'tracking/users'), snap => {
        const data = snap.val() || {};
        document.getElementById('user-list').innerHTML = '';
        document.getElementById('offline-list').innerHTML = '';
        
        Object.keys(data).forEach(uid => {
            const u = data[uid];
            if (u.status === 'active') {
                if (!knownUsers.has(uid)) { knownUsers.add(uid); activeTrackers.add(uid); }
                renderCard(uid, u);
                
                if (activeTrackers.has(uid)) {
                    updateMarker(uid, u);
                    enableTrajectory(uid);
                } else {
                    removeMarker(uid);
                    disableTrajectory(uid);
                }
            } else {
                renderOffline(uid, u);
                if (activeTrackers.has(uid)) { activeTrackers.delete(uid); }
                removeMarker(uid);
                disableTrajectory(uid);
            }
        });
    });

    let initialGlobalAlert = true;
    onValue(ref(db, 'tracking/alerts/global'), (snap) => {
        if (initialGlobalAlert) { initialGlobalAlert = false; return; }
        const data = snap.val();
        if (data && data.type === 'alarm') {
            pcSound.play().catch(e=>{});
            log(`⚠️ 收到來自 ${data.triggerBy} 的緊急警報！`);
        }
    });

    let initialCrAlert = true;
    onValue(ref(db, 'tracking/alerts/fun_cr'), (snap) => {
        if (initialCrAlert) { initialCrAlert = false; return; }
        const data = snap.val();
        if (data && data.triggerBy !== 'HQ') log(`🔊 收到來自 ${data.triggerBy} 的支援 CR 請求`);
    });

    function renderCard(uid, u) {
        const div = document.createElement('div'); 
        div.className = 'user-card';
        const isTracked = activeTrackers.has(uid);
        const nameClass = u.isAlarm ? 'flash-name' : '';
        const crTag = u.needCR ? `<span class="cr-tag">支援CR</span>` : '';
        
        let envTagHtml = '';
        if (u.envStatus) {
            const statuses = u.envStatus.split(',');
            statuses.forEach(status => {
                if (!status) return;
                let envClass = '';
                switch(status) {
                    case '安全': envClass = 'env-safe'; break;
                    case '警戒': envClass = 'env-alert'; break;
                    case '車輛不通': envClass = 'env-blocked'; break;
                    case '有傷患': envClass = 'env-casualty'; break;
                    case '前往集合': envClass = 'env-rally'; break;
                    case '路坍': envClass = 'env-collapse'; break;
                }
                envTagHtml += `<span class="env-tag ${envClass}">${status}</span>`;
            });
        }
        
        let batteryHTML = '';
        if (u.battery !== undefined && u.battery !== null) {
            const batClass = u.battery <= 20 ? 'battery-low' : '';
            batteryHTML = `<span class="battery-badge ${batClass}">🔋${u.battery}% ${u.charging ? '⚡' : ''}</span>`;
        }
        
        let remarkHtml = '';
        if (u.envRemark) {
            remarkHtml = `<div class="remark-box" onclick="this.classList.toggle('expanded')" title="點擊展開/收合">📝 備註：${u.envRemark}</div>`;
        }

        // 🔮 照片按鈕動態產生
        let photoBtnHtml = '';
        if (u.images && u.images.length > 0) {
            window.globalPhotos[uid] = u.images; // 存入全域，方便 modal 呼叫
            photoBtnHtml = `<button class="action-btn btn-photo" onclick="showPhotoModal('${uid}')">📸 照片(${u.images.length})</button>`;
        }

        div.innerHTML = `
            <div class="header-row">
                <input type="checkbox" class="track-cb" data-uid="${uid}" ${isTracked ? 'checked' : ''}>
                <span class="${nameClass}">${uid}</span> ${crTag} ${envTagHtml} ${batteryHTML}
            </div>
            <div class="info-row">
                <span>座標: ${u.lat.toFixed(4)}, ${u.lng.toFixed(4)}</span>
                <span>回報: ${new Date(u.timestamp).toLocaleTimeString()}</span>
            </div>
            <div class="action-grid">
                <button class="action-btn btn-alert" onclick="sendCmd('${uid}', 'targeted_alert')">警報</button>
                <button class="action-btn btn-call" onclick="sendCmd('${uid}', 'targeted_cr')">呼叫</button>
                <button class="action-btn btn-path" onclick="sendPath('${uid}')">路徑</button>
                <button class="action-btn btn-off" onclick="forceOff('${uid}')">離線</button>
                ${photoBtnHtml}
            </div>
            ${remarkHtml}`;
            
        document.getElementById('user-list').appendChild(div);

        div.querySelector('.track-cb').addEventListener('change', (e) => {
            if (e.target.checked) { 
                activeTrackers.add(uid); updateMarker(uid, u); enableTrajectory(uid); 
            } else { 
                activeTrackers.delete(uid); removeMarker(uid); disableTrajectory(uid); 
            }
        });
    }

    function renderOffline(uid, u) { 
        const div = document.createElement('div'); div.style.padding='5px 10px'; div.style.borderBottom='1px solid #222'; div.style.fontSize='0.8em';
        div.innerHTML = `<span style="color:#666">${uid} (已離線) - ${new Date(u.timestamp).toLocaleTimeString()}</span>`;
        document.getElementById('offline-list').appendChild(div);
    }

    function updateMarker(uid, u) {
        const color = u.isAlarm ? '#ff0055' : '#00f3ff';
        if (markers[uid]) { 
            markers[uid].setLatLng([u.lat, u.lng]); markers[uid].setStyle({color: color}); 
        } else { 
            markers[uid] = L.circleMarker([u.lat, u.lng], {radius:6, color: color, fillOpacity: 0.8}).addTo(map); 
        }
    }
    
    function removeMarker(uid) {
        if (markers[uid]) { map.removeLayer(markers[uid]); delete markers[uid]; }
    }

    function enableTrajectory(uid) {
        if (!hListeners[uid]) {
            hListeners[uid] = onValue(ref(db, `tracking/history/${uid}`), s => {
                const pts = Object.values(s.val() || {}).map(p => [p.lat, p.lng]);
                if (polylines[uid]) polylines[uid].setLatLngs(pts);
                else polylines[uid] = L.polyline(pts, {color:'#00f3ff', weight:2, dashArray:'5,5'}).addTo(map);
            });
        }
    }
    
    function disableTrajectory(uid) {
        if (polylines[uid]) { map.removeLayer(polylines[uid]); delete polylines[uid]; }
        if (hListeners[uid]) { hListeners[uid](); delete hListeners[uid]; }
    }

    // 🔮 照片 Modal 控制函數
    window.showPhotoModal = (uid) => {
        const photos = window.globalPhotos[uid];
        if (!photos) return;
        const gallery = document.getElementById('modalGallery');
        gallery.innerHTML = photos.map(src => `<img src="${src}">`).join('');
        document.getElementById('photoModal').style.display = 'flex';
    };
    
    window.closePhotoModal = () => {
        document.getElementById('photoModal').style.display = 'none';
        document.getElementById('modalGallery').innerHTML = '';
    };

    window.sendCmd = (uid, type) => { set(ref(db, `tracking/alerts/${type}/${uid}`), {timestamp: Date.now()}); log(`已向 ${uid} 發送指令`); };
    window.sendPath = uid => {
        if (plannedPath.length < 1) return alert("請先點擊地圖規劃路徑");
        set(ref(db, `tracking/commands/${uid}/path_mission`), { points: plannedPath, timestamp: Date.now() }); log(`已向 ${uid} 派發路徑`);
    };
    window.forceOff = uid => {
        if (confirm("強制離線：\n[確定] 徹底刪除所有資料\n[取消] 斷線並保留紀錄於摺疊區")) { remove(ref(db, `tracking/users/${uid}`)); remove(ref(db, `tracking/history/${uid}`)); }
        else { set(ref(db, `tracking/commands/${uid}/force_offline`), { timestamp: Date.now() }); update(ref(db, `tracking/users/${uid}`), {status:'offline'}); }
    };
</script>
</body>
</html>
