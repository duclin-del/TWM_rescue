<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>戰情儀表板 (Analysis)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; background: #0a0a0a; color: #00f3ff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #map-container { flex: 3; position: relative; border-right: 2px solid #00f3ff; }
        #map { width: 100%; height: 100%; }
        .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%); }
        #sidebar { flex: 1; background: rgba(0, 20, 30, 0.95); padding: 15px; display: flex; flex-direction: column; min-width: 380px; }
        .toolbar { display: flex; justify-content: space-between; border-bottom: 1px solid #047a80; padding-bottom: 10px; margin-bottom: 10px; }
        .user-card { background: rgba(0,0,0,0.6); border: 1px solid #047a80; padding: 10px; margin-bottom: 8px; font-size: 0.85em; border-radius: 4px; }
        .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; }
        .action-btn { background: transparent; border: 1px solid; color: inherit; font-size: 0.75em; padding: 4px 0; cursor: pointer; border-radius: 3px; }
        .btn-track.active { background: #00f3ff; color: #000; }
        #log-panel { height: 100px; border-top: 1px dashed #047a80; font-size: 0.75em; overflow-y: auto; padding-top: 5px; }
    </style>
</head>
<body>
<div id="map-container"><div id="map"></div></div>
<div id="sidebar">
    <div class="toolbar">
        <b>即時動態監控</b>
        <div><button onclick="clearPath()">清除路徑</button> <button onclick="batchTrack(true)">全選</button></div>
    </div>
    <div id="user-list" style="flex-grow:1; overflow-y:auto;"></div>
    <details><summary style="cursor:pointer; color:#888; padding:5px;">離線紀錄</summary><div id="offline-list" style="max-height:150px; overflow-y:auto;"></div></details>
    <div id="log-panel" id="logs"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { firebaseConfig } from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const map = L.map('map').setView([23.7, 121], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let plannedPath = [], pathLine = L.polyline([], {color:'#00ffaa', dashArray:'5,10'}).addTo(map), markers = {}, polylines = {}, hListeners = {};

    map.on('click', e => {
        plannedPath.push([e.latlng.lat, e.latlng.lng]);
        pathLine.setLatLngs(plannedPath);
        L.circleMarker(e.latlng, {radius:4, color:'#00ffaa'}).addTo(map);
    });

    window.clearPath = () => { plannedPath = []; pathLine.setLatLngs([]); log("路徑已清除"); };

    function log(m) { const d = document.createElement('div'); d.innerHTML = `[${new Date().toLocaleTimeString()}] ${m}`; document.getElementById('log-panel').prepend(d); }

    onValue(ref(db, 'tracking/users'), snap => {
        const data = snap.val() || {};
        document.getElementById('user-list').innerHTML = '';
        document.getElementById('offline-list').innerHTML = '';
        Object.keys(data).forEach(uid => {
            const u = data[uid];
            if (u.status === 'active') renderCard(uid, u);
            else renderOffline(uid, u);
            updateMarker(uid, u);
        });
    });

    function renderCard(uid, u) {
        const isT = !!polylines[uid];
        const div = document.createElement('div'); div.className = 'user-card';
        div.innerHTML = `<b>${uid}</b> <span style="float:right; color:${u.battery<=20?'#f05':'#0f3'}">🔋${u.battery}%</span>
            <div class="action-grid">
                <button class="action-btn" style="border-color:#ffcc00;color:#ffcc00" onclick="sendCall('${uid}')">呼叫</button>
                <button class="action-btn" style="border-color:#00ffaa;color:#00ffaa" onclick="sendPath('${uid}')">路徑</button>
                <button class="action-btn btn-track ${isT?'active':''}" id="t-${uid}">軌跡</button>
                <button class="action-btn" style="border-color:#f05;color:#f05" onclick="forceOff('${uid}')">離線</button>
            </div>`;
        document.getElementById('user-list').appendChild(div);
        div.querySelector(`#t-${uid}`).onclick = () => toggleT(uid);
    }

    function renderOffline(uid, u) { 
        const div = document.createElement('div'); div.style.padding='5px'; div.style.borderBottom='1px solid #222';
        div.innerHTML = `<span style="color:#666">${uid} (OFFLINE) - ${new Date(u.timestamp).toLocaleTimeString()}</span>`;
        document.getElementById('offline-list').appendChild(div);
    }

    function updateMarker(uid, u) {
        if (u.status === 'active') {
            if (markers[uid]) markers[uid].setLatLng([u.lat, u.lng]);
            else markers[uid] = L.circleMarker([u.lat, u.lng], {radius:6, color:'#00f3ff'}).addTo(map);
        } else if (markers[uid]) { map.removeLayer(markers[uid]); delete markers[uid]; }
    }

    window.sendPath = uid => {
        if (plannedPath.length < 1) return alert("請先點擊地圖規劃路徑");
        set(ref(db, `tracking/commands/${uid}/path_mission`), { points: plannedPath, timestamp: Date.now() });
        log(`已向 ${uid} 派發路徑`);
    };

    window.forceOff = uid => {
        const del = confirm("強制離線：\n[確定] 徹底刪除所有資料\n[取消] 斷線並保留紀錄於摺疊區");
        if (del) { remove(ref(db, `tracking/users/${uid}`)); remove(ref(db, `tracking/history/${uid}`)); log(`已移除 ${uid} 所有資料`); }
        else { set(ref(db, `tracking/commands/${uid}/force_offline`), { timestamp: Date.now() }); update(ref(db, `tracking/users/${uid}`), {status:'offline'}); log(`${uid} 已強制離線`); }
    };

    function toggleT(uid) {
        if (polylines[uid]) { map.removeLayer(polylines[uid]); delete polylines[uid]; if(hListeners[uid]) hListeners[uid](); }
        else {
            hListeners[uid] = onValue(ref(db, `tracking/history/${uid}`), s => {
                const pts = Object.values(s.val() || {}).map(p => [p.lat, p.lng]);
                if (polylines[uid]) polylines[uid].setLatLngs(pts);
                else polylines[uid] = L.polyline(pts, {color:'#00f3ff', weight:2, dashArray:'5,5'}).addTo(map);
            });
        }
    }

    window.sendCall = uid => set(ref(db, `tracking/alerts/targeted_cr/${uid}`), {timestamp: Date.now()});
    window.batchTrack = on => document.querySelectorAll('.btn-track').forEach(b => b.click());
</script>
</body>
</html>
