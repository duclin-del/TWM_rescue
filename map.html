<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>戰情儀表板 (Analysis)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; background: #0a0a0a; color: #00f3ff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #map-container { flex: 3; position: relative; border-right: 2px solid #00f3ff; }
        #map { width: 100%; height: 100%; background: #000; }
        .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%); transition: filter 0.4s ease; }
        #map.real-world-mode .leaflet-tile-pane { filter: none !important; }
        
        #sidebar { flex: 1; background: rgba(0, 20, 30, 0.95); padding: 15px; display: flex; flex-direction: column; min-width: 400px; }
        
        .toolbar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #047a80; padding-bottom: 10px; margin-bottom: 10px; flex-wrap: wrap; gap: 5px; }
        .toolbar button { background: transparent; border: 1px solid #00f3ff; color: #00f3ff; padding: 5px 8px; cursor: pointer; border-radius: 3px; font-weight: bold; }
        .toolbar button:hover { background: #00f3ff; color: #000; }
        .btn-danger { border-color: #ff0055 !important; color: #ff0055 !important; }
        .btn-danger:hover { background: #ff0055 !important; color: #fff !important; }
        .btn-map-toggle { border-color: #ffaa00 !important; color: #ffaa00 !important; }
        .btn-map-toggle:hover { background: #ffaa00 !important; color: #000 !important; }
        .btn-export { border-color: #00ffaa !important; color: #00ffaa !important; }
        .btn-export:hover { background: #00ffaa !important; color: #000 !important; }
        
        /* 🔮 新增：AI 總結按鈕樣式 */
        .btn-ai-report { border-color: #bb00ff !important; color: #bb00ff !important; background: rgba(187, 0, 255, 0.1); }
        .btn-ai-report:hover { background: #bb00ff !important; color: #fff !important; box-shadow: 0 0 10px #bb00ff; }

        .user-card { background: rgba(0,0,0,0.6); border: 1px solid #047a80; padding: 8px 10px; margin-bottom: 8px; font-size: 0.85em; border-radius: 4px; }
        .user-card:hover { border-color: #00f3ff; }
        
        .header-row { display: flex; align-items: center; font-size: 1.1em; font-weight: bold; margin-bottom: 4px; flex-wrap: wrap; gap: 4px; }
        .info-row { color: #aaa; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9em; }
        
        .cr-tag { background: #ffcc00; color: #000; font-size: 0.7em; padding: 2px 6px; border-radius: 10px; vertical-align: middle; }
        .env-tag { font-size: 0.7em; padding: 2px 6px; border-radius: 4px; font-weight: bold; vertical-align: middle; }
        .env-safe { background: #00ffaa; color: #000; }
        .env-alert { background: #ffcc00; color: #000; }
        .env-blocked { background: #ff5500; color: #fff; }
        .env-casualty { background: #ff0055; color: #fff; }
        .env-rally { background: #0088ff; color: #fff; }
        .env-collapse { background: #995522; color: #fff; }

        .flash-name { color: #ff0055; text-shadow: 0 0 10px #ff0055; animation: blinkFast 0.5s infinite alternate; }
        @keyframes blinkFast { from { opacity: 1; } to { opacity: 0.3; } }
        
        .battery-badge { font-size: 0.8em; padding: 1px 5px; border-radius: 3px; border: 1px solid #00f3ff; margin-left: auto; }
        .battery-low { border-color: #ff0055; color: #ff0055; animation: blinkFast 1s infinite alternate; }

        .action-grid { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        .action-btn { flex: 1 1 18%; background: transparent; border: 1px solid; color: inherit; font-size: 0.8em; padding: 4px 0; cursor: pointer; border-radius: 3px; text-align: center; white-space: nowrap; }
        .btn-alert { border-color: #ff0055; color: #ff0055; }
        .btn-call { border-color: #ffcc00; color: #ffcc00; }
        .btn-path { border-color: #00ffaa; color: #00ffaa; }
        .btn-off { border-color: #888; color: #888; }
        .btn-photo { border-color: #00aaff; color: #00aaff; } 
        
        .remark-box { margin-top: 5px; font-size: 0.85em; color: #ffaa00; background: rgba(255, 170, 0, 0.1); padding: 4px 8px; border-radius: 3px; border-left: 2px solid #ffaa00; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; transition: all 0.2s ease; }
        .remark-box.expanded { white-space: normal; word-break: break-all; }
        
        .ai-box { margin-top: 5px; font-size: 0.85em; background: rgba(0, 243, 255, 0.1); padding: 6px; border-radius: 3px; border-left: 2px solid #00f3ff; }
        .ai-badge { display: inline-block; background: #005577; color: #fff; padding: 2px 5px; border-radius: 3px; margin-right: 5px; margin-top: 3px; font-size: 0.9em;}
        .ai-urgency-high { background: #ff0055; animation: blinkFast 1s infinite alternate; }

        #log-panel { height: 100px; border-top: 1px dashed #047a80; font-size: 0.75em; overflow-y: auto; padding-top: 5px; margin-top: 10px; }
        input[type="checkbox"] { accent-color: #00f3ff; width: 16px; height: 16px; margin-right: 5px; cursor: pointer; }

        #photoModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        #photoModal .close-btn { position: absolute; top: 20px; right: 20px; background: transparent; color: #ff0055; border: 1px solid #ff0055; padding: 8px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 1.1em; z-index: 10000;}
        #photoModal .close-btn:hover { background: #ff0055; color: #fff; }
        .carousel-container { display: flex; align-items: center; justify-content: center; position: relative; max-width: 95vw; max-height: 85vh; }
        .carousel-btn { background: rgba(0, 243, 255, 0.2); border: 2px solid #00f3ff; color: #00f3ff; font-size: 2em; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin: 0 20px; transition: all 0.3s ease; }
        .carousel-btn:hover { background: #00f3ff; color: #000; }
        .image-wrapper { position: relative; display: inline-block; }
        #modalImg { max-height: 80vh; max-width: 75vw; object-fit: contain; border: 2px solid #00f3ff; border-radius: 8px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.3); }
        #modalCaption { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0, 0, 0, 0.7); color: #00ffaa; padding: 15px 0; text-align: center; font-size: 1.2em; font-family: monospace; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; box-sizing: border-box; }

        /* 🔮 新增：AI 報告檢視窗 Modal */
        #aiReportModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,20,30,0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        .ai-report-container { background: #0a0a0a; border: 2px solid #bb00ff; border-radius: 10px; width: 80%; max-width: 800px; height: 80%; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(187, 0, 255, 0.4); }
        .ai-report-header { padding: 15px; border-bottom: 1px solid #bb00ff; display: flex; justify-content: space-between; align-items: center; background: rgba(187, 0, 255, 0.1); }
        .ai-report-title { font-size: 1.5em; font-weight: bold; color: #bb00ff; margin: 0; }
        .ai-report-content { flex-grow: 1; padding: 20px; overflow-y: auto; color: #fff; font-size: 1.1em; line-height: 1.6; white-space: pre-wrap; }
        .ai-report-content h1, .ai-report-content h2, .ai-report-content h3 { color: #00f3ff; }
        .ai-report-content strong { color: #ffaa00; }
        .ai-report-footer { padding: 15px; border-top: 1px solid #bb00ff; text-align: right; background: rgba(0,0,0,0.5); }
    </style>
</head>
<body>
<div id="map-container"><div id="map"></div></div>
<div id="sidebar">
    <div class="toolbar">
        <!-- 💡 新增：AI 災情總結按鈕 -->
        <button id="btnAiReport" class="btn-ai-report" onclick="generateAIReport()">🤖 AI 災情總結</button>
        <button class="btn-export" onclick="exportGeoJSON()">📥 GeoJSON</button>
        <button id="mapToggleBtn" class="btn-map-toggle" onclick="toggleMapType()">🛰️ 衛星</button>
        <button onclick="clearPath()">清路徑</button>
        <button onclick="toggleAllTrack(true)">全選</button>
        <button onclick="toggleAllTrack(false)">取消</button>
        <button class="btn-danger" onclick="allRetreat()" style="width: 100%;">🚨 全體撤退</button>
    </div>
    
    <div id="user-list" style="flex-grow:1; overflow-y:auto;"></div>
    <details><summary style="cursor:pointer; color:#888; padding:5px; border-top:1px solid #333; margin-top:5px;">離線紀錄</summary><div id="offline-list"></div></details>
    <div id="log-panel" id="logs"></div>
    
    <audio id="pcAlertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
</div>

<!-- 照片 Modal -->
<div id="photoModal">
    <button class="close-btn" onclick="closePhotoModal()">關閉 (X)</button>
    <div class="carousel-container">
        <button class="carousel-btn" onclick="navPhoto(-1)">&#10094;</button>
        <div class="image-wrapper">
            <img id="modalImg" src="">
            <div id="modalCaption">照片 1/5 | 拍攝時間: --</div>
        </div>
        <button class="carousel-btn" onclick="navPhoto(1)">&#10095;</button>
    </div>
</div>

<!-- 🔮 新增：AI 報告 Modal -->
<div id="aiReportModal">
    <div class="ai-report-container">
        <div class="ai-report-header">
            <h3 class="ai-report-title">🤖 災防決策幕僚分析報告</h3>
            <button onclick="closeAIReport()" style="background:transparent; border:none; color:#ff0055; font-size:1.5em; cursor:pointer;">✖</button>
        </div>
        <div id="aiReportContent" class="ai-report-content">載入中...</div>
        <div class="ai-report-footer">
            <button class="btn-export" onclick="downloadAIReport()" style="padding: 10px 20px; font-size: 1em;">💾 下載報告 (TXT)</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { firebaseConfig } from './firebase-config.js';

    // 💡 務必填入您的 Gemini API Key 才能執行 AI 總結功能
    const GEMINI_API_KEY = "請填入您的Gemini API Key";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const map = L.map('map').setView([23.7, 121], 7);
    
    const defaultLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
    const contourLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, opacity: 0.35 });
    
    defaultLayer.addTo(map);
    let isSatelliteMode = false;

    window.toggleMapType = () => {
        const mapDiv = document.getElementById('map');
        const toggleBtn = document.getElementById('mapToggleBtn');
        if (!isSatelliteMode) {
            map.removeLayer(defaultLayer); satelliteLayer.addTo(map); contourLayer.addTo(map);
            mapDiv.classList.add('real-world-mode'); 
            toggleBtn.innerHTML = "🗺️ 預設"; log("已切換為「衛星與等高線」");
        } else {
            map.removeLayer(satelliteLayer); map.removeLayer(contourLayer); defaultLayer.addTo(map);
            mapDiv.classList.remove('real-world-mode'); 
            toggleBtn.innerHTML = "🛰️ 衛星"; log("已切換回「預設」模式");
        }
        isSatelliteMode = !isSatelliteMode;
    };

    const pcSound = document.getElementById('pcAlertSound');

    let plannedPath = [], pathMarkers = [];
    let pathLine = L.polyline([], {color:'#00ffaa', weight:3, dashArray:'5,10'}).addTo(map);
    
    const activeTrackers = new Set(); 
    let knownUsers = new Set();       
    const markers = {}, polylines = {}, hListeners = {};
    window.globalPhotos = {}; 
    let currentModalPhotos = [], currentPhotoIndex = 0;
    
    let currentUsersData = {}; 

    map.on('click', e => {
        plannedPath.push([e.latlng.lat, e.latlng.lng]);
        pathLine.setLatLngs(plannedPath);
        pathMarkers.push(L.circleMarker(e.latlng, {radius:4, color:'#00ffaa'}).addTo(map));
        log(`已加入路徑點`);
    });

    window.clearPath = () => { 
        plannedPath = []; pathLine.setLatLngs([]); 
        pathMarkers.forEach(m => map.removeLayer(m)); pathMarkers = []; 
        log("路徑與標記已清除"); 
    };

    window.toggleAllTrack = (check) => {
        document.querySelectorAll('.track-cb').forEach(cb => {
            if (cb.checked !== check) { cb.checked = check; cb.dispatchEvent(new Event('change')); }
        });
    };

    window.allRetreat = () => {
        if(confirm('確定要對所有人員發出「全體撤退」警報嗎？')) {
            set(ref(db, `tracking/commands/global/retreat`), { timestamp: Date.now() });
            log("🚨 已發出全體撤退指令！");
        }
    };

    window.exportGeoJSON = () => {
        const features = [];
        Object.keys(currentUsersData).forEach(uid => {
            const u = currentUsersData[uid];
            if (u.status !== 'active') return;
            features.push({
                type: "Feature",
                geometry: { type: "Point", coordinates: [u.lng, u.lat] },
                properties: { id: uid, timestamp: u.timestamp, battery: u.battery, envStatus: u.envStatus, rawRemark: u.envRemark, aiAnalysis: u.ai_analysis }
            });
        });

        const geojson = { type: "FeatureCollection", features: features };
        const blob = new Blob([JSON.stringify(geojson, null, 2)], {type: "application/json;charset=utf-8"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Disaster_Report_${new Date().getTime()}.geojson`;
        a.click();
        log("✅ 已匯出標準化 GeoJSON");
    };

    // 🔮 核心：產生 AI 災情總結與優先權分析
    let currentReportText = "";
    window.generateAIReport = async () => {
        const activeUsers = [];
        Object.keys(currentUsersData).forEach(uid => {
            if (currentUsersData[uid].status === 'active') {
                const u = currentUsersData[uid];
                activeUsers.push({
                    人員ID: uid,
                    座標: `${u.lat}, ${u.lng}`,
                    環境標籤: u.envStatus || "無",
                    現場備註: u.envRemark || "無",
                    AI單點解析: u.ai_analysis || "無",
                    手機電量: `${u.battery}%` || "未知"
                });
            }
        });

        if (activeUsers.length === 0) {
            alert("目前沒有活動中的通報人員資料可供分析！");
            return;
        }

        const btn = document.getElementById('btnAiReport');
        btn.innerText = "⏳ 幕僚分析中...";
        btn.disabled = true;

        const prompt = `你是一個專業的災防指揮官 AI 幕僚。
以下是目前第一線人員回報的最新數據集合（包含各人員的環境標籤、文字備註與單一事件解析）：
${JSON.stringify(activeUsers)}

請根據這些數據綜合分析，產出一份「即時災防指揮總結報告」。報告必須清楚條理，嚴格包含以下三大區塊：

## 一、 災情總覽大綱
(請用一段話總結目前的整體狀況，並列出主要受到影響的區域或事件類型)

## 二、 案件處理優先權清單 (至關重要)
(請將所有人員回報的事件進行排序，分為「🔴 高優先級」、「🟡 中優先級」、「🟢 低優先級」。每一項必須明確指出是哪位【人員ID】回報的，並說明為何給予該優先級。若有人員電量低於20%，也必須列入風險考量。)

## 三、 指揮官資源調度建議
(根據上述需求，建議應優先派遣何種資源，如救護車、重機具等)

請直接輸出繁體中文的 Markdown 格式內容，語氣需專業、簡潔、嚴謹。`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${AIzaSyDKmJ5UkQp_zz_u1t5RrkQJ__2AdSmRgMw}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            
            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                currentReportText = data.candidates[0].content.parts[0].text;
                
                // 簡單將 Markdown 轉為可看性較高的 HTML
                let displayHtml = currentReportText
                    .replace(/## (.*?)\n/g, '<h2 style="margin-top:20px; border-bottom:1px solid #444; padding-bottom:5px;">$1</h2>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                
                document.getElementById('aiReportContent').innerHTML = displayHtml;
                document.getElementById('aiReportModal').style.display = 'flex';
                log("✅ AI 災情總結報告已生成");
            } else {
                alert("AI 回應異常，請稍後再試或檢查 API Key。");
            }
        } catch (error) {
            console.error(error);
            alert("生成報告失敗，請檢查網路連線或 API Key。");
        }

        btn.innerText = "🤖 AI 災情總結";
        btn.disabled = false;
    };

    window.closeAIReport = () => {
        document.getElementById('aiReportModal').style.display = 'none';
    };

    window.downloadAIReport = () => {
        if (!currentReportText) return;
        const blob = new Blob([currentReportText], {type: "text/plain;charset=utf-8"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `AI_Commander_Report_${new Date().getTime()}.txt`;
        a.click();
    };

    function log(m) { const d = document.createElement('div'); d.innerHTML = `[${new Date().toLocaleTimeString()}] ${m}`; document.getElementById('log-panel').prepend(d); }

    onValue(ref(db, 'tracking/users'), snap => {
        currentUsersData = snap.val() || {}; 
        document.getElementById('user-list').innerHTML = '';
        document.getElementById('offline-list').innerHTML = '';
        
        Object.keys(currentUsersData).forEach(uid => {
            const u = currentUsersData[uid];
            if (u.status === 'active') {
                if (!knownUsers.has(uid)) { knownUsers.add(uid); activeTrackers.add(uid); }
                renderCard(uid, u);
                
                if (activeTrackers.has(uid)) {
                    updateMarker(uid, u); enableTrajectory(uid);
                } else {
                    removeMarker(uid); disableTrajectory(uid);
                }
            } else {
                renderOffline(uid, u);
                if (activeTrackers.has(uid)) { activeTrackers.delete(uid); }
                removeMarker(uid); disableTrajectory(uid);
            }
        });
    });

    let initialGlobalAlert = true;
    onValue(ref(db, 'tracking/alerts/global'), (snap) => {
        if (initialGlobalAlert) { initialGlobalAlert = false; return; }
        const data = snap.val();
        if (data && data.type === 'alarm') {
            pcSound.play().catch(e=>{});
            log(`⚠️ 收到來自 ${data.triggerBy} 的緊急警報！`);
        }
    });

    let initialCrAlert = true;
    onValue(ref(db, 'tracking/alerts/fun_cr'), (snap) => {
        if (initialCrAlert) { initialCrAlert = false; return; }
        const data = snap.val();
        if (data && data.triggerBy !== 'HQ') log(`🔊 收到來自 ${data.triggerBy} 的支援 CR 請求`);
    });

    function renderCard(uid, u) {
        const div = document.createElement('div'); 
        div.className = 'user-card';
        const isTracked = activeTrackers.has(uid);
        const nameClass = u.isAlarm ? 'flash-name' : '';
        const crTag = u.needCR ? `<span class="cr-tag">支援CR</span>` : '';
        
        let envTagHtml = '';
        if (u.envStatus) {
            const statuses = u.envStatus.split(',');
            statuses.forEach(status => {
                if (!status) return;
                let envClass = '';
                switch(status) {
                    case '安全': envClass = 'env-safe'; break;
                    case '警戒': envClass = 'env-alert'; break;
                    case '車輛不通': envClass = 'env-blocked'; break;
                    case '有傷患': envClass = 'env-casualty'; break;
                    case '前往集合': envClass = 'env-rally'; break;
                    case '路坍': envClass = 'env-collapse'; break;
                }
                envTagHtml += `<span class="env-tag ${envClass}">${status}</span>`;
            });
        }
        
        let batteryHTML = '';
        if (u.battery !== undefined && u.battery !== null) {
            const batClass = u.battery <= 20 ? 'battery-low' : '';
            batteryHTML = `<span class="battery-badge ${batClass}">🔋${u.battery}% ${u.charging ? '⚡' : ''}</span>`;
        }
        
        let remarkHtml = '';
        if (u.envRemark) { remarkHtml = `<div class="remark-box" onclick="this.classList.toggle('expanded')" title="點擊展開/收合">📝 原文：${u.envRemark}</div>`; }

        let aiHtml = '';
        if (u.ai_analysis) {
            const ai = u.ai_analysis;
            const urgencyClass = ai.urgency === '高' ? 'ai-urgency-high' : '';
            let needsHtml = '';
            if (ai.needs && Array.isArray(ai.needs) && ai.needs.length > 0) { needsHtml = `<br>所需物資: <span style="color:#ffcc00">${ai.needs.join('、')}</span>`; }

            aiHtml = `
                <div class="ai-box">
                    <span class="ai-badge ${urgencyClass}">急迫性: ${ai.urgency || '未知'}</span>
                    <span class="ai-badge">🤖 AI解析</span>
                    <div style="margin-top:4px;">
                        事件: <span style="color:#fff">${ai.event || '無'}</span><br>
                        傷亡: <span style="color:#ff0055">${ai.casualties || '無'}</span>
                        ${needsHtml}
                    </div>
                </div>
            `;
        }

        let photoBtnHtml = '';
        if (u.images && u.images.length > 0) {
            window.globalPhotos[uid] = u.images; 
            photoBtnHtml = `<button class="action-btn btn-photo" onclick="showPhotoModal('${uid}')">📸 照片(${u.images.length})</button>`;
        }

        div.innerHTML = `
            <div class="header-row">
                <input type="checkbox" class="track-cb" data-uid="${uid}" ${isTracked ? 'checked' : ''}>
                <span class="${nameClass}">${uid}</span> ${crTag} ${envTagHtml} ${batteryHTML}
            </div>
            <div class="info-row">
                <span>座標: ${u.lat.toFixed(4)}, ${u.lng.toFixed(4)}</span>
                <span>回報: ${new Date(u.timestamp).toLocaleTimeString()}</span>
            </div>
            <div class="action-grid">
                <button class="action-btn btn-alert" onclick="sendCmd('${uid}', 'targeted_alert')">警報</button>
                <button class="action-btn btn-call" onclick="sendCmd('${uid}', 'targeted_cr')">呼叫</button>
                <button class="action-btn btn-path" onclick="sendPath('${uid}')">路徑</button>
                <button class="action-btn btn-off" onclick="forceOff('${uid}')">離線</button>
                ${photoBtnHtml}
            </div>
            ${remarkHtml}
            ${aiHtml}`;
            
        document.getElementById('user-list').appendChild(div);

        div.querySelector('.track-cb').addEventListener('change', (e) => {
            if (e.target.checked) { 
                activeTrackers.add(uid); updateMarker(uid, u); enableTrajectory(uid); 
            } else { 
                activeTrackers.delete(uid); removeMarker(uid); disableTrajectory(uid); 
            }
        });
    }

    function renderOffline(uid, u) { 
        const div = document.createElement('div'); div.style.padding='5px 10px'; div.style.borderBottom='1px solid #222'; div.style.fontSize='0.8em';
        div.innerHTML = `<span style="color:#666">${uid} (已離線) - ${new Date(u.timestamp).toLocaleTimeString()}</span>`;
        document.getElementById('offline-list').appendChild(div);
    }

    function updateMarker(uid, u) {
        let color = '#00f3ff';
        if (u.isAlarm || (u.ai_analysis && u.ai_analysis.urgency === '高')) { color = '#ff0055'; }
        
        if (markers[uid]) { 
            markers[uid].setLatLng([u.lat, u.lng]); markers[uid].setStyle({color: color}); 
        } else { 
            markers[uid] = L.circleMarker([u.lat, u.lng], {radius:6, color: color, fillOpacity: 0.8}).addTo(map); 
        }
    }
    
    function removeMarker(uid) {
        if (markers[uid]) { map.removeLayer(markers[uid]); delete markers[uid]; }
    }

    function enableTrajectory(uid) {
        if (!hListeners[uid]) {
            hListeners[uid] = onValue(ref(db, `tracking/history/${uid}`), s => {
                const pts = Object.values(s.val() || {}).map(p => [p.lat, p.lng]);
                if (polylines[uid]) polylines[uid].setLatLngs(pts);
                else polylines[uid] = L.polyline(pts, {color:'#00f3ff', weight:2, dashArray:'5,5'}).addTo(map);
            });
        }
    }
    
    function disableTrajectory(uid) {
        if (polylines[uid]) { map.removeLayer(polylines[uid]); delete polylines[uid]; }
        if (hListeners[uid]) { hListeners[uid](); delete hListeners[uid]; }
    }

    window.showPhotoModal = (uid) => {
        currentModalPhotos = window.globalPhotos[uid];
        if (!currentModalPhotos || currentModalPhotos.length === 0) return;
        currentPhotoIndex = 0; updateModalView(); document.getElementById('photoModal').style.display = 'flex';
    };
    
    window.navPhoto = (direction) => {
        currentPhotoIndex += direction;
        if (currentPhotoIndex < 0) currentPhotoIndex = currentModalPhotos.length - 1;
        if (currentPhotoIndex >= currentModalPhotos.length) currentPhotoIndex = 0;
        updateModalView();
    };
    
    function updateModalView() {
        const photoObj = currentModalPhotos[currentPhotoIndex];
        document.getElementById('modalImg').src = photoObj.data;
        document.getElementById('modalCaption').innerText = `照片 ${currentPhotoIndex + 1} / ${currentModalPhotos.length}  |  拍攝時間: ${new Date(photoObj.time).toLocaleString()}`;
    }
    
    window.closePhotoModal = () => { document.getElementById('photoModal').style.display = 'none'; document.getElementById('modalImg').src = ''; };

    window.sendCmd = (uid, type) => { set(ref(db, `tracking/alerts/${type}/${uid}`), {timestamp: Date.now()}); log(`已向 ${uid} 發送指令`); };
    window.sendPath = uid => {
        if (plannedPath.length < 1) return alert("請先點擊地圖規劃路徑");
        set(ref(db, `tracking/commands/${uid}/path_mission`), { points: plannedPath, timestamp: Date.now() }); log(`已向 ${uid} 派發路徑`);
    };
    window.forceOff = uid => {
        if (confirm("強制離線：\n[確定] 徹底刪除所有資料\n[取消] 斷線並保留紀錄於摺疊區")) { remove(ref(db, `tracking/users/${uid}`)); remove(ref(db, `tracking/history/${uid}`)); }
        else { set(ref(db, `tracking/commands/${uid}/force_offline`), { timestamp: Date.now() }); update(ref(db, `tracking/users/${uid}`), {status:'offline'}); }
    };
</script>
</body>
</html>
