<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>戰情儀表板 (Analysis)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; background: #05090c; color: #00f3ff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #map-container { flex: 3; position: relative; border-right: 1px solid #047a80; }
        #map { width: 100%; height: 100%; background: #020405; }
        .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(85%); }
        #map.real-world-mode .leaflet-tile-pane { filter: none !important; }
        
        #sidebar { flex: 1; background: #020608; padding: 15px; display: flex; flex-direction: column; min-width: 420px; box-shadow: -5px 0 15px rgba(0,0,0,0.5); }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #047a80; }
        .toolbar button { background: rgba(0, 243, 255, 0.1); border: 1px solid #00f3ff; color: #00f3ff; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .toolbar button:hover { background: #00f3ff; color: #000; }
        .btn-ai { border-color: #bb00ff !important; color: #bb00ff !important; }

        /* 卡片設計 */
        .user-card { background: rgba(0, 20, 30, 0.4); border-left: 4px solid #005577; padding: 12px; margin-bottom: 10px; border-radius: 4px; position: relative; }
        .user-card.severe { border-left-color: #ff0055; background: rgba(255, 0, 85, 0.1); }
        .user-name { font-weight: bold; color: #00f3ff; cursor: crosshair; font-size: 1.2em; text-decoration: underline; text-underline-offset: 4px; }
        .user-name:hover { color: #00ffaa; }
        
        .tag-outline { border: 1px solid #00ffaa; color: #00ffaa; padding: 2px 6px; border-radius: 4px; font-size: 0.75em; margin-right: 5px; }
        .tag-solid { background: #ff0055; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.75em; font-weight: bold; }
        
        .ai-box { background: rgba(0,0,0,0.5); border: 1px solid #005577; padding: 8px; margin-top: 10px; font-size: 0.9em; }
        #aiReportModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; align-items: center; justify-content: center; }
        .report-box { background: #05090c; border: 2px solid #bb00ff; width: 80%; height: 80%; padding: 20px; overflow-y: auto; position: relative; }
    </style>
</head>
<body>
<div id="map-container"><div id="map"></div></div>
<div id="sidebar">
    <div class="toolbar">
        <button class="btn-ai" onclick="generateAIReport()">🤖 幕僚 AI 總結</button>
        <button onclick="toggleMapType()">🛰️ 衛星視角</button>
        <button onclick="exportGeoJSON()">📥 GeoJSON</button>
        <button style="border-color:#ff0055; color:#ff0055;" onclick="allRetreat()">🚨 全體撤退</button>
    </div>
    <div id="user-list" style="flex:1; overflow-y:auto;"></div>
    <div id="log-panel" style="height:100px; border-top:1px solid #333; font-size:0.8em; padding-top:10px;"></div>
</div>

<!-- AI 報告彈窗 -->
<div id="aiReportModal">
    <div class="report-box">
        <h2 style="color:#bb00ff;">🤖 災防決策幕僚分析報告</h2>
        <div id="aiReportContent" style="white-space:pre-wrap; line-height:1.6;"></div>
        <button onclick="document.getElementById('aiReportModal').style.display='none'" style="position:absolute; top:10px; right:20px; color:#ff0055; background:none; border:none; font-size:2em; cursor:pointer;">✖</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { firebaseConfig } from './firebase-config.js';

    const OPENROUTER_API_KEY = "REPLACE_WITH_OPENROUTER_KEY";
    const OPENROUTER_MODEL = "nvidia/nemotron-3-super-120b-a12b";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const map = L.map('map').setView([23.7, 121], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let currentUsersData = {};
    const markers = {};

    // 💡 點擊雷達鎖定
    window.focusMap = (lat, lng) => {
        map.flyTo([lat, lng], 16, { duration: 1.5 });
    };

    onValue(ref(db, 'tracking/users'), snap => {
        currentUsersData = snap.val() || {};
        const list = document.getElementById('user-list');
        list.innerHTML = '';
        Object.keys(currentUsersData).forEach(uid => {
            const u = currentUsersData[uid];
            if (u.status !== 'active') return;
            
            // 更新地圖點
            if (!markers[uid]) markers[uid] = L.circleMarker([u.lat, u.lng], {radius:7, color:'#00f3ff'}).addTo(map);
            else markers[uid].setLatLng([u.lat, u.lng]);

            // 渲染卡片
            const isSevere = u.ai_analysis?.urgency === '高';
            const div = document.createElement('div');
            div.className = `user-card ${isSevere ? 'severe' : ''}`;
            div.innerHTML = `
                <span class="user-name" onclick="focusMap(${u.lat}, ${u.lng})">${uid}</span>
                <div style="margin:5px 0;">座標: ${u.lat.toFixed(4)}, ${u.lng.toFixed(4)}</div>
                <div>${u.envStatus ? u.envStatus.split(',').map(s=>`<span class="tag-outline">${s}</span>`).join('') : ''}</div>
                ${u.envRemark ? `<div style="color:#ffaa00; margin-top:5px;">💬 ${u.envRemark}</div>` : ''}
            `;
            list.appendChild(div);
        });
    });

    // AI 總結
    window.generateAIReport = async () => {
        const modal = document.getElementById('aiReportModal');
        const content = document.getElementById('aiReportContent');
        modal.style.display = 'flex'; content.innerText = "🤖 幕僚運算中...";

        try {
            const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${OPENROUTER_API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: OPENROUTER_MODEL,
                    messages: [{ role: "user", content: `你是災防指揮官。分析以下數據並給出「災情大綱」與「處理優先權」：${JSON.stringify(currentUsersData)}` }]
                })
            });
            const data = await res.json();
            content.innerText = data.choices[0].message.content;
        } catch (e) {
            content.innerText = JSON.stringify(currentUsersData, null, 2) + "\n\n(API失效)";
        }
    };

    window.toggleMapType = () => document.getElementById('map').classList.toggle('real-world-mode');
</script>
</body>
</html>
