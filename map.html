<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>戰情儀表板 (Analysis)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; background: #05090c; color: #00f3ff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #map-container { flex: 3; position: relative; border-right: 1px solid #047a80; box-shadow: inset -5px 0 15px rgba(0,0,0,0.5); }
        #map { width: 100%; height: 100%; background: #020405; }
        .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(110%); transition: filter 0.5s ease; }
        #map.real-world-mode .leaflet-tile-pane { filter: none !important; }
        
        /* 座標浮動顯示 HUD */
        #map-coord-overlay {
            display: none; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;
            background: rgba(0, 20, 30, 0.85); border: 1px solid #00ffaa; color: #00ffaa;
            padding: 8px 20px; border-radius: 20px; font-family: monospace; font-size: 1.1em; font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.3); pointer-events: none; transition: opacity 0.3s;
        }

        #sidebar { flex: 1; background: linear-gradient(135deg, #020608 0%, #05131a 100%); padding: 15px; display: flex; flex-direction: column; min-width: 420px; z-index: 10; box-shadow: -5px 0 15px rgba(0,243,255,0.05); }
        
        /* 雙層工具列排版 */
        .toolbar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; padding-bottom: 12px; border-bottom: 1px solid rgba(4, 122, 128, 0.5); }
        .toolbar-row { display: flex; gap: 6px; width: 100%; justify-content: space-between; }
        .toolbar button { flex: 1; background: rgba(0, 243, 255, 0.05); border: 1px solid #00f3ff; color: #00f3ff; padding: 6px 4px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: all 0.2s; white-space: nowrap; font-size: 0.85em; }
        .toolbar button:hover { background: #00f3ff; color: #000; box-shadow: 0 0 10px rgba(0,243,255,0.5); }
        .btn-ai { border-color: #bb00ff !important; color: #bb00ff !important; }
        .btn-ai:hover { background: #bb00ff !important; color: #fff !important; }
        .btn-export { border-color: #00ffaa !important; color: #00ffaa !important; }
        .btn-export:hover { background: #00ffaa !important; color: #000 !important; }
        .btn-danger { border-color: #ff0055 !important; color: #ff0055 !important; padding: 8px !important; font-size: 0.9em !important; }
        .btn-danger:hover { background: #ff0055 !important; color: #fff !important; }

        .user-card { background: rgba(0, 20, 30, 0.4); border-left: 4px solid #005577; padding: 12px; margin-bottom: 10px; border-radius: 4px; position: relative; transition: all 0.3s; }
        .user-card:hover { border-left-color: #00f3ff; background: rgba(0, 30, 45, 0.6); }
        .user-card.severe { border-left-color: #ff0055; background: rgba(255, 0, 85, 0.1); }
        
        .header-row { display: flex; align-items: center; font-size: 1.1em; margin-bottom: 4px; flex-wrap: wrap; }
        
        .user-name { font-weight: bold; color: #00f3ff; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: all 0.2s; }
        .user-name:hover { background: rgba(0, 243, 255, 0.1); outline: 1px solid #00f3ff; text-shadow: 0 0 8px #00f3ff; }
        
        /* 環境標籤與時間排版 */
        .tags-container { display: flex; gap: 4px; margin-left: 10px; align-items: center; flex-wrap: wrap; flex: 1; }
        .time-badge { margin-left: auto; font-size: 0.75em; color: #666; font-family: monospace; }
        
        .tag-outline { border: 1px solid currentColor; color: #00ffaa; padding: 2px 6px; border-radius: 4px; font-size: 0.75em; }
        .tag-solid { background: currentColor; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.75em; font-weight: bold; text-shadow: 0 0 2px rgba(0,0,0,0.8); }
        
        .flash-name { color: #ff0055 !important; text-shadow: 0 0 10px #ff0055; animation: blinkFast 0.5s infinite alternate; }
        @keyframes blinkFast { from { opacity: 1; } to { opacity: 0.3; } }

        /* 動作按鈕區塊 */
        .action-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .action-btn { flex: 1; background: transparent; border: 1px solid; color: inherit; font-size: 0.8em; padding: 5px 0; cursor: pointer; border-radius: 4px; text-align: center; transition: all 0.2s; white-space: nowrap; }
        .btn-alert { border-color: #ff0055; color: #ff0055; } .btn-alert:hover { background: #ff0055; color: #fff; }
        .btn-call { border-color: #ffcc00; color: #ffcc00; } .btn-call:hover { background: #ffcc00; color: #000; }
        .btn-path { border-color: #00ffaa; color: #00ffaa; } .btn-path:hover { background: #00ffaa; color: #000; }
        .btn-off { border-color: #555; color: #888; } .btn-off:hover { background: #555; color: #fff; }
        .btn-photo { border-color: #00aaff; color: #00aaff; } .btn-photo:hover { background: #00aaff; color: #000; }
        
        .remark-box { margin-top: 6px; font-size: 0.85em; color: #ccc; background: rgba(255, 255, 255, 0.05); padding: 6px 10px; border-radius: 4px; border-left: 2px solid #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; transition: all 0.2s ease; }
        .remark-box:hover { border-left-color: #ffaa00; color: #ffaa00; background: rgba(255, 255, 255, 0.1); }
        .remark-box.expanded { white-space: normal; word-break: break-all; }
        
        .ai-box { margin-top: 6px; font-size: 0.85em; background: rgba(0, 0, 0, 0.5); padding: 8px; border-radius: 4px; border: 1px solid #005577; }
        .ai-box.ai-severe { border-color: #ff0055; background: rgba(255, 0, 85, 0.1); }
        .ai-badge { display: inline-block; padding: 2px 6px; border-radius: 3px; margin-right: 6px; margin-bottom: 4px; font-size: 0.85em; }
        .ai-urgency-high { background: #ff0055; color: #fff; font-weight: bold; box-shadow: 0 0 8px #ff0055; animation: blinkFast 1s infinite alternate; }
        
        #log-panel { height: 120px; border-top: 1px solid rgba(4, 122, 128, 0.5); font-size: 0.75em; overflow-y: auto; padding-top: 10px; margin-top: auto; color: #888; font-family: monospace; }
        input[type="checkbox"] { accent-color: #00f3ff; width: 16px; height: 16px; margin-right: 5px; cursor: pointer; }

        /* Modal 樣式：照片與 AI 報告 */
        #photoModal, #aiReportModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,10,15,0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .close-btn { position: absolute; top: 20px; right: 20px; background: transparent; color: #ff0055; border: 1px solid #ff0055; padding: 8px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; z-index: 10000; transition: all 0.2s;}
        .close-btn:hover { background: #ff0055; color: #fff; box-shadow: 0 0 15px #ff0055;}
        
        .carousel-container { display: flex; align-items: center; justify-content: center; position: relative; max-width: 95vw; max-height: 85vh; }
        .carousel-btn { background: rgba(0, 243, 255, 0.1); border: 1px solid #00f3ff; color: #00f3ff; font-size: 2em; padding: 10px 15px; cursor: pointer; border-radius: 4px; margin: 0 20px; transition: all 0.3s; }
        .carousel-btn:hover { background: #00f3ff; color: #000; }
        .image-wrapper { position: relative; display: inline-block; }
        #modalImg { max-height: 80vh; max-width: 75vw; object-fit: contain; border: 1px solid #00f3ff; border-radius: 4px; box-shadow: 0 0 30px rgba(0, 243, 255, 0.2); }
        #modalCaption { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0, 0, 0, 0.8); color: #00ffaa; padding: 12px 0; text-align: center; font-size: 1.1em; font-family: monospace; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; }

        .report-box { background: #020608; border: 1px solid #bb00ff; border-radius: 8px; width: 85%; max-width: 900px; height: 85%; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(187, 0, 255, 0.2); position: relative; padding: 20px; overflow: hidden;}
    </style>
</head>
<body>

<div id="map-container">
    <div id="map"></div>
    <div id="map-coord-overlay"></div>
</div>

<div id="sidebar">
    <div class="toolbar">
        <div class="toolbar-row">
            <button id="toggleAllBtn" onclick="toggleSelectAll()">全選</button>
            <button onclick="toggleMapType()">衛星地圖</button>
            <button onclick="clearPath()">清空路徑</button>
            <button class="btn-ai" onclick="generateAIReport()">AI總結</button>
            <button class="btn-export" onclick="exportGeoJSON()">JSON輸出</button>
        </div>
        <button class="btn-danger" onclick="allRetreat()">🚨 全體撤退</button>
    </div>
    
    <div id="user-list" style="flex:1; overflow-y:auto; padding-right: 5px;"></div>
    
    <details style="margin-top: 10px;"><summary style="cursor:pointer; color:#666; padding:8px 0; border-top:1px solid #222; font-size: 0.9em; transition: color 0.2s;">歷史離線紀錄</summary><div id="offline-list"></div></details>
    <div id="log-panel"></div>
    
    <audio id="pcAlertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
</div>

<!-- 影像檢視彈窗 -->
<div id="photoModal">
    <button class="close-btn" onclick="closePhotoModal()">✖ 關閉</button>
    <div class="carousel-container">
        <button class="carousel-btn" onclick="navPhoto(-1)">&#10094;</button>
        <div class="image-wrapper">
            <img id="modalImg" src="">
            <div id="modalCaption">影像擷取中...</div>
        </div>
        <button class="carousel-btn" onclick="navPhoto(1)">&#10095;</button>
    </div>
</div>

<!-- AI 報告彈窗 -->
<div id="aiReportModal">
    <div class="report-box">
        <h2 style="color:#bb00ff; margin-top: 0; border-bottom: 1px solid #bb00ff; padding-bottom: 10px;">🤖 災防決策幕僚分析報告</h2>
        <div id="aiReportContent" style="white-space:pre-wrap; line-height:1.6; color:#ddd; overflow-y: auto; flex: 1;">資料同步與解析中...</div>
        <div style="margin-top: 15px; text-align: right;">
            <button class="btn-export" onclick="downloadAIReport()" style="padding: 8px 15px; font-size: 1em; background:transparent; cursor:pointer;">💾 下載報告</button>
        </div>
        <button onclick="document.getElementById('aiReportModal').style.display='none'" style="position:absolute; top:15px; right:20px; color:#ff0055; background:none; border:none; font-size:1.8em; cursor:pointer;">✖</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { firebaseConfig } from './firebase-config.js';

    const OPENROUTER_API_KEY = "REPLACE_WITH_OPENROUTER_KEY";
    const OPENROUTER_MODEL = "nvidia/nemotron-3-super-120b-a12b";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const map = L.map('map').setView([23.7, 121], 7);
    
    const defaultLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
    const contourLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, opacity: 0.4 });
    let isSatelliteMode = false;

    const pcSound = document.getElementById('pcAlertSound');
    let plannedPath = [], pathMarkers = [];
    let pathLine = L.polyline([], {color:'#00ffaa', weight:3, dashArray:'5,10'}).addTo(map);
    
    const activeTrackers = new Set(); 
    let knownUsers = new Set();       
    const markers = {}, polylines = {}, hListeners = {};
    window.globalPhotos = {}; 
    let currentModalPhotos = [], currentPhotoIndex = 0;
    let currentUsersData = {}; 
    let hudTimeout = null;

    // 地圖點擊：自訂路徑規劃
    map.on('click', e => {
        plannedPath.push([e.latlng.lat, e.latlng.lng]);
        pathLine.setLatLngs(plannedPath);
        pathMarkers.push(L.circleMarker(e.latlng, {radius:4, color:'#00ffaa'}).addTo(map));
        log(`登錄導航航點：${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`);
    });

    // 雷達鎖定與浮動座標顯示
    window.focusMap = (lat, lng, uid, battery) => {
        map.flyTo([lat, lng], 17, { duration: 1.2, easeLinearity: 0.25 });
        const overlay = document.getElementById('map-coord-overlay');
        let batStr = (battery !== null && battery !== undefined) ? ` | ⚡ ${battery}%` : '';
        overlay.innerHTML = `📍 目標 [${uid}] | 座標：${lat.toFixed(5)}, ${lng.toFixed(5)}${batStr}`;
        overlay.style.display = 'block';
        log(`雷達鎖定：${uid}`);
        
        if(hudTimeout) clearTimeout(hudTimeout);
        hudTimeout = setTimeout(() => overlay.style.display = 'none', 4000);
    };

    // Firebase 監聽
    onValue(ref(db, 'tracking/users'), snap => {
        currentUsersData = snap.val() || {};
        document.getElementById('user-list').innerHTML = '';
        document.getElementById('offline-list').innerHTML = '';
        
        Object.keys(currentUsersData).forEach(uid => {
            const u = currentUsersData[uid];
            if (u.status === 'active') {
                if (!knownUsers.has(uid)) { knownUsers.add(uid); activeTrackers.add(uid); }
                renderCard(uid, u);
                if (activeTrackers.has(uid)) { updateMarker(uid, u); enableTrajectory(uid); } 
                else { removeMarker(uid); disableTrajectory(uid); }
            } else {
                renderOffline(uid, u);
                if (activeTrackers.has(uid)) activeTrackers.delete(uid);
                removeMarker(uid); disableTrajectory(uid);
            }
        });
    });

    onValue(ref(db, 'tracking/alerts/global'), (snap) => {
        const data = snap.val();
        if (data && data.timestamp > Date.now() - 5000) {
            pcSound.play().catch(e=>{}); log(`⚠️ 截獲來自 ${data.triggerBy} 的緊急信號！`);
        }
    });

    function renderCard(uid, u) {
        const div = document.createElement('div'); 
        const isTracked = activeTrackers.has(uid);
        const isSevere = u.isAlarm || (u.ai_analysis && u.ai_analysis.urgency === '高');
        div.className = `user-card ${isSevere ? 'severe' : ''}`;
        
        const nameClass = u.isAlarm ? 'flash-name' : '';
        const crTag = u.needCR ? `<span class="tag-outline" style="color:#ffcc00; border-color:#ffcc00;">請求CR</span>` : '';
        
        let envTagHtml = '';
        if (u.envStatus) {
            u.envStatus.split(',').forEach(status => {
                if (!status) return;
                let cssClass = 'tag-outline'; let styleStr = '';
                switch(status) {
                    case '安全': styleStr = 'color:#00ffaa; border-color:#00ffaa;'; break;
                    case '警戒': styleStr = 'color:#ffaa00; border-color:#ffaa00;'; break;
                    case '前往集合': styleStr = 'color:#00aaff; border-color:#00aaff;'; break;
                    case '車輛不通': cssClass = 'tag-solid'; styleStr = 'background:#ff5500; color:#fff;'; break;
                    case '路坍': cssClass = 'tag-solid'; styleStr = 'background:#995522; color:#fff;'; break;
                    case '有傷患': cssClass = 'tag-solid'; styleStr = 'background:#ff0055; color:#fff; animation: blinkFast 1s infinite alternate;'; break;
                }
                envTagHtml += `<span class="${cssClass}" style="${styleStr}">${status}</span>`;
            });
        }
        
        const timeStr = new Date(u.timestamp).toLocaleTimeString('zh-TW', {hour12: false});
        
        let aiHtml = '';
        if (u.ai_analysis) {
            const ai = u.ai_analysis;
            const isHigh = ai.urgency === '高';
            aiHtml = `
                <div class="ai-box ${isHigh ? 'ai-severe' : ''}">
                    <span class="ai-badge" style="border:1px solid #444; color:#888;">🧠 AI判讀</span>
                    <span class="ai-badge ${isHigh ? 'ai-urgency-high' : ''}" style="color:#00aaff;">風險別: ${ai.urgency || '未知'}</span>
                    <div style="margin-top:4px;">事件: <span style="color:#fff">${ai.event || '無'}</span></div>
                </div>
            `;
        }

        let photoBtnHtml = '';
        if (u.images && u.images.length > 0) {
            window.globalPhotos[uid] = u.images; 
            photoBtnHtml = `<button class="action-btn btn-photo" onclick="showPhotoModal('${uid}')">📷 檢視照片(${u.images.length})</button>`;
        }

        div.innerHTML = `
            <div class="header-row">
                <input type="checkbox" class="track-cb" data-uid="${uid}" ${isTracked ? 'checked' : ''} title="顯示/隱藏軌跡">
                <span class="user-name ${nameClass}" onclick="focusMap(${u.lat}, ${u.lng}, '${uid}', ${u.battery !== undefined ? u.battery : 'null'})" title="鎖定地圖位置">${uid}</span> 
                <div class="tags-container">
                    ${crTag} ${envTagHtml}
                    <span class="time-badge">${timeStr}</span>
                </div>
            </div>
            ${u.envRemark ? `<div class="remark-box" onclick="this.classList.toggle('expanded')">💬 備註：${u.envRemark}</div>` : ''}
            ${aiHtml}
            <div class="action-grid">
                <button class="action-btn btn-alert" onclick="sendCmd('${uid}', 'targeted_alert')">發布警報</button>
                <button class="action-btn btn-call" onclick="sendCmd('${uid}', 'targeted_cr')">CR呼叫</button>
                <button class="action-btn btn-path" onclick="sendPath('${uid}')">派發路徑</button>
                <button class="action-btn btn-off" onclick="forceOff('${uid}')">離線/刪除</button>
                ${photoBtnHtml}
            </div>
        `;
        document.getElementById('user-list').appendChild(div);

        div.querySelector('.track-cb').addEventListener('change', (e) => {
            if (e.target.checked) { activeTrackers.add(uid); updateMarker(uid, u); enableTrajectory(uid); } 
            else { activeTrackers.delete(uid); removeMarker(uid); disableTrajectory(uid); }
        });
    }

    function renderOffline(uid, u) { 
        const div = document.createElement('div'); div.style.padding='6px 12px'; div.style.borderBottom='1px solid rgba(255,255,255,0.05)'; div.style.fontSize='0.8em'; div.style.fontFamily='monospace';
        div.innerHTML = `<span style="color:#555">[-] ${uid} (已離線) - ${new Date(u.timestamp).toLocaleTimeString('zh-TW', {hour12:false})}</span>`;
        document.getElementById('offline-list').appendChild(div);
    }

    function updateMarker(uid, u) {
        let color = '#00f3ff';
        if (u.isAlarm || (u.ai_analysis && u.ai_analysis.urgency === '高')) color = '#ff0055'; 
        
        // 💡 標記優化：高透明度、細外框，不遮蔽底圖
        if (markers[uid]) { markers[uid].setLatLng([u.lat, u.lng]); markers[uid].setStyle({color: color}); } 
        else { markers[uid] = L.circleMarker([u.lat, u.lng], {radius:7, color: color, weight: 1.5, fillOpacity: 0.1}).addTo(map); }
    }
    
    function removeMarker(uid) { if (markers[uid]) { map.removeLayer(markers[uid]); delete markers[uid]; } }

    function enableTrajectory(uid) {
        if (!hListeners[uid]) {
            hListeners[uid] = onValue(ref(db, `tracking/history/${uid}`), s => {
                const pts = Object.values(s.val() || {}).map(p => [p.lat, p.lng]);
                if (polylines[uid]) polylines[uid].setLatLngs(pts);
                else polylines[uid] = L.polyline(pts, {color:'#005577', weight:3, opacity: 0.7, dashArray:'5,8'}).addTo(map);
            });
        }
    }
    function disableTrajectory(uid) {
        if (polylines[uid]) { map.removeLayer(polylines[uid]); delete polylines[uid]; }
        if (hListeners[uid]) { hListeners[uid](); delete hListeners[uid]; }
    }

    // 功能操作群
    window.toggleMapType = () => {
        if (!isSatelliteMode) { map.removeLayer(defaultLayer); satelliteLayer.addTo(map); contourLayer.addTo(map); document.getElementById('map').classList.add('real-world-mode'); log("切換至：衛星+地形"); } 
        else { map.removeLayer(satelliteLayer); map.removeLayer(contourLayer); defaultLayer.addTo(map); document.getElementById('map').classList.remove('real-world-mode'); log("切換至：科技地圖"); }
        isSatelliteMode = !isSatelliteMode;
    };

    window.clearPath = () => { plannedPath = []; pathLine.setLatLngs([]); pathMarkers.forEach(m => map.removeLayer(m)); pathMarkers = []; log("路徑標記已清空"); };
    
    // 一鍵切換全選/不選
    window.toggleSelectAll = () => {
        const cbs = Array.from(document.querySelectorAll('.track-cb'));
        const allChecked = cbs.length > 0 && cbs.every(cb => cb.checked);
        const targetState = !allChecked;
        cbs.forEach(cb => { if (cb.checked !== targetState) { cb.checked = targetState; cb.dispatchEvent(new Event('change')); }});
        document.getElementById('toggleAllBtn').innerText = targetState ? "不選" : "全選";
    };
    
    window.allRetreat = () => { if(confirm('確定要對所有人員發布全域撤退？')) { set(ref(db, `tracking/commands/global/retreat`), { timestamp: Date.now() }); log("🚨 發布全體撤退指令"); }};
    window.sendCmd = (uid, type) => { set(ref(db, `tracking/alerts/${type}/${uid}`), {timestamp: Date.now()}); log(`傳送指令至：${uid}`); };
    window.sendPath = uid => { if (plannedPath.length < 1) return alert("請先於地圖點擊以設置導航航點"); set(ref(db, `tracking/commands/${uid}/path_mission`), { points: plannedPath, timestamp: Date.now() }); log(`路徑已發送至：${uid}`); };
    
    window.forceOff = uid => {
        if (confirm(`【操作確認】\n[確定] 徹底刪除 ${uid} 的所有資料\n[取消] 僅斷開連線轉入離線紀錄`)) { remove(ref(db, `tracking/users/${uid}`)); remove(ref(db, `tracking/history/${uid}`)); }
        else { set(ref(db, `tracking/commands/${uid}/force_offline`), { timestamp: Date.now() }); update(ref(db, `tracking/users/${uid}`), {status:'offline'}); }
    };

    window.exportGeoJSON = () => {
        const features = [];
        Object.keys(currentUsersData).forEach(uid => {
            const u = currentUsersData[uid]; if (u.status !== 'active') return;
            features.push({ type: "Feature", geometry: { type: "Point", coordinates: [u.lng, u.lat] }, properties: { id: uid, timestamp: u.timestamp, battery: u.battery, envStatus: u.envStatus, remark: u.envRemark } });
        });
        const blob = new Blob([JSON.stringify({ type: "FeatureCollection", features: features }, null, 2)], {type: "application/json;charset=utf-8"});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `GeoData_${new Date().getTime()}.geojson`; a.click();
    };

    window.showPhotoModal = (uid) => {
        currentModalPhotos = window.globalPhotos[uid];
        if (!currentModalPhotos || currentModalPhotos.length === 0) return;
        currentPhotoIndex = 0; 
        document.getElementById('modalImg').src = currentModalPhotos[currentPhotoIndex].data;
        document.getElementById('modalCaption').innerText = `紀錄 1 / ${currentModalPhotos.length} | 時間: ${new Date(currentModalPhotos[currentPhotoIndex].time).toLocaleString()}`;
        document.getElementById('photoModal').style.display = 'flex';
    };
    window.navPhoto = (direction) => {
        currentPhotoIndex = (currentPhotoIndex + direction + currentModalPhotos.length) % currentModalPhotos.length;
        document.getElementById('modalImg').src = currentModalPhotos[currentPhotoIndex].data;
        document.getElementById('modalCaption').innerText = `紀錄 ${currentPhotoIndex + 1} / ${currentModalPhotos.length} | 時間: ${new Date(currentModalPhotos[currentPhotoIndex].time).toLocaleString()}`;
    };
    window.closePhotoModal = () => { document.getElementById('photoModal').style.display = 'none'; document.getElementById('modalImg').src = ''; };

    let currentReportText = "";
    window.generateAIReport = async () => {
        const activeUsers = Object.keys(currentUsersData).filter(uid => currentUsersData[uid].status === 'active').map(uid => ({
            ID: uid, 座標: `${currentUsersData[uid].lat}, ${currentUsersData[uid].lng}`, 狀態: currentUsersData[uid].envStatus, 備註: currentUsersData[uid].envRemark
        }));
        if (activeUsers.length === 0) return alert("無活動節點。");

        const content = document.getElementById('aiReportContent');
        document.getElementById('aiReportModal').style.display = 'flex';
        content.innerText = "🤖 幕僚演算中...";

        try {
            const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${OPENROUTER_API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: OPENROUTER_MODEL,
                    messages: [{ role: "user", content: `你是災防指揮官。分析以下數據並給出「災情大綱」與「處理優先權」：${JSON.stringify(activeUsers)}` }]
                })
            });
            const data = await res.json();
            if (res.ok && data.choices) {
                currentReportText = data.choices[0].message.content;
                content.innerHTML = currentReportText.replace(/## (.*?)\n/g, '<h3 style="color:#00f3ff; margin-top:20px; border-bottom:1px solid #333;">$1</h3>').replace(/\*\*(.*?)\*\*/g, '<strong style="color:#ffaa00;">$1</strong>');
            } else throw new Error();
        } catch (e) {
            currentReportText = JSON.stringify(activeUsers, null, 2) + "\n\n(API失效)";
            content.innerHTML = `<pre style="color:#aaa;">${currentReportText}</pre>`;
        }
    };
    window.downloadAIReport = () => {
        if (!currentReportText) return;
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([currentReportText], {type: "text/plain;charset=utf-8"}));
        a.download = `Report_${new Date().getTime()}.txt`; a.click();
    };

    function log(m) { const d = document.createElement('div'); d.innerHTML = `[${new Date().toLocaleTimeString('zh-TW', {hour12:false})}] ${m}`; document.getElementById('log-panel').prepend(d); }
</script>
</body>
</html>
