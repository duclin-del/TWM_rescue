<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>災防通報：指揮中心戰情儀表板</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #0a0a0a; color: #00f3ff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #map-container { flex: 3; position: relative; border-right: 2px solid #00f3ff; background: #000; }
        #map { width: 100%; height: 100%; }
        .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }

        #sidebar { flex: 1; background: rgba(0, 20, 30, 0.95); padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; min-width: 380px; }
        
        .toolbar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #047a80; margin-bottom: 10px; }
        .toolbar button { background: transparent; border: 1px solid #00f3ff; color: #00f3ff; padding: 4px 8px; cursor: pointer; font-size: 0.8em; border-radius: 3px; }

        #user-list { flex-grow: 1; overflow-y: auto; }
        
        .user-card { background: rgba(0, 0, 0, 0.6); border: 1px solid #047a80; border-radius: 4px; padding: 10px; margin-bottom: 8px; font-size: 0.85em; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .card-title { font-weight: bold; font-size: 1.1em; display: flex; align-items: center; }
        
        .battery-badge { font-size: 0.8em; padding: 1px 5px; border-radius: 3px; border: 1px solid #00f3ff; }
        .battery-low { border-color: #ff0055; color: #ff0055; animation: blink 1s infinite alternate; }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; margin-top: 8px; }
        .action-btn { background: transparent; border: 1px solid; border-radius: 3px; padding: 4px 2px; cursor: pointer; font-size: 0.75em; color: inherit; text-align: center; }
        .btn-cr { border-color: #ffcc00; color: #ffcc00; }
        .btn-rally { border-color: #00ffaa; color: #00ffaa; }
        .btn-track { border-color: #00f3ff; color: #00f3ff; }
        .btn-off { border-color: #ff0055; color: #ff0055; }
        .active-track { background: #00f3ff; color: #000; }

        details { margin-top: 10px; border-top: 1px solid #333; }
        summary { cursor: pointer; padding: 10px; color: #888; font-size: 0.9em; outline: none; }
        .offline-box { max-height: 200px; overflow-y: auto; }
        .mini-card { display: flex; justify-content: space-between; padding: 5px 10px; background: rgba(255,255,255,0.05); margin-bottom: 2px; font-size: 0.8em; }

        #log-panel { height: 120px; border-top: 1px dashed #047a80; padding-top: 10px; font-size: 0.8em; }
        #log-messages { height: 80px; overflow-y: auto; background: rgba(0,0,0,0.5); padding: 5px; }
        
        @keyframes blink { from { opacity: 1; } to { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
    </div>
    
    <div id="sidebar">
        <div class="toolbar">
            <span style="font-size: 0.9em; font-weight: bold;">戰情監控 (ANALYSIS)</span>
            <button id="clearPath">清除規劃路徑</button>
        </div>

        <div id="user-list"></div>
        
        <details>
            <summary>已保留的離線紀錄</summary>
            <div id="offline-list" class="offline-box"></div>
        </details>
        
        <div id="log-panel">
            <div id="log-messages"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { firebaseConfig } from './firebase-config.js';

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const map = L.map('map').setView([23.6978, 120.9605], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        const markers = {};
        const polylines = {};
        const historyListeners = {};
        
        // 🔮 新增：路徑規劃變數
        let plannedPathCoords = [];
        let pathPreviewLine = L.polyline([], {color: '#00ffaa', weight: 3, dashArray: '5, 10'}).addTo(map);
        let pathMarkers = [];

        // 點擊地圖規劃路徑
        map.on('click', (e) => {
            const coord = [e.latlng.lat, e.latlng.lng];
            plannedPathCoords.push(coord);
            pathPreviewLine.setLatLngs(plannedPathCoords);
            
            // 放置導引點標記
            const dot = L.circleMarker(coord, {radius: 4, color: '#00ffaa', fillOpacity: 1}).addTo(map);
            pathMarkers.push(dot);
            
            addLogMessage(`已加入路徑點: ${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`);
        });

        document.getElementById('clearPath').onclick = () => {
            plannedPathCoords = [];
            pathPreviewLine.setLatLngs([]);
            pathMarkers.forEach(m => map.removeLayer(m));
            pathMarkers = [];
            addLogMessage("已清除規劃路徑");
        };

        function addLogMessage(msg) {
            const div = document.createElement('div');
            div.innerHTML = `<span style="color:#888">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            document.getElementById('log-messages').prepend(div);
        }

        onValue(ref(db, 'tracking/users'), (snapshot) => {
            const data = snapshot.val() || {};
            document.getElementById('user-list').innerHTML = '';
            document.getElementById('offline-list').innerHTML = '';

            Object.keys(data).forEach(uid => {
                const user = data[uid];
                const isActive = user.status === 'active';
                if (isActive) {
                    renderCard(uid, user);
                    updateMarker(uid, user);
                } else {
                    renderOffline(uid, user);
                }
            });
        });

        function renderCard(uid, user) {
            const isTrack = !!polylines[uid];
            const div = document.createElement('div');
            div.className = 'user-card';
            div.innerHTML = `
                <div class="card-header">
                    <span class="card-title">● ${uid}</span>
                    <span class="battery-badge ${user.battery <= 20 ? 'battery-low' : ''}">🔋${user.battery}%</span>
                </div>
                <div class="action-grid">
                    <button class="action-btn btn-cr" onclick="window.sendCall('${uid}')">呼叫</button>
                    <button class="action-btn btn-rally" onclick="window.sendPath('${uid}')">派發路徑</button>
                    <button class="action-btn btn-track ${isTrack ? 'active-track' : ''}" onclick="window.toggleT('${uid}')">軌跡</button>
                    <button class="action-btn btn-off" onclick="window.fOff('${uid}')">離線</button>
                </div>
            `;
            document.getElementById('user-list').appendChild(div);
        }

        function renderOffline(uid, user) {
            const div = document.createElement('div');
            div.className = 'mini-card';
            div.innerHTML = `<span>${uid}</span><span>${new Date(user.timestamp).toLocaleTimeString()}</span>`;
            document.getElementById('offline-list').appendChild(div);
        }

        function updateMarker(uid, user) {
            if (markers[uid]) markers[uid].setLatLng([user.lat, user.lng]);
            else markers[uid] = L.circleMarker([user.lat, user.lng], {radius: 6, color: '#00f3ff'}).addTo(map);
        }

        // 🔮 核心：派發指定路徑
        window.sendPath = (uid) => {
            if (plannedPathCoords.length < 1) return alert("請先在地圖上點擊規劃至少一個路徑點");
            
            // 將座標數組傳給 Firebase
            set(ref(db, `tracking/commands/${uid}/path_mission`), {
                points: plannedPathCoords,
                timestamp: Date.now()
            });
            addLogMessage(`🚩 已向 ${uid} 派發指定路徑任務`);
        };

        window.sendCall = (uid) => set(ref(db, `tracking/alerts/fun_cr`), {triggerBy: 'HQ', timestamp: Date.now()});
        window.toggleT = (uid) => { /* 沿用之前的軌跡邏輯 */ };
        window.fOff = (uid) => { /* 沿用之前的離線三段邏輯 */ };
    </script>
</body>
</html>
